юридичних осіб."],"correct":1},{"num":24,"q":"На які подарунки не поширюється передбачене Законом України «Про запобігання корупції» обмеження щодо їхньої вартості?","answers":["на подарунки, які дарують близькі особи;","на подарунки, які являють собою неподільне майно;","на подарунки, які дарують у зв’язку з ювілеєм особи:","на подарунки, які подарував безпосередній керівник особи."],"correct":0},{"num":25,"q":"Яким визнається рішення, прийняте посадовою особою Бюро економічної безпеки України на користь особи, від якої вона чи її близька особа отримали подарунок, згідно із Законом України «Про запобігання корупції»?","answers":["таким, що прийняте в умовах конфлікту інтересів;","таким, що прийняте не уповноваженим суб’єктом;","таким, що прийняте в умовах виправданого ризику;","таким, що прийняте в умовах неетичної поведінки."],"correct":0},{"num":26,"q":"Яким, відповідно до Закону України «Про запобігання корупції», є наслідок прийняття посадовою особою Бюро економічної безпеки України рішення на користь особи, від якої вона чи її близька особа отримали подарунок?","answers":["рішення підлягає перезатвердженню;","рішення залишається без виконання;","рішення підлягає скасуванню або визнанню його незаконним в судовому порядку;","рішення підлягає перегляду."],"correct":2},{"num":27,"q":"На яких осіб НЕ поширюються передбачені Законом України «Про запобігання корупції» обмеження щодо сумісництва та суміщення з іншими видами діяльності?","answers":["на присяжних;","на членів Кабінету Міністрів України;","на суддів;","на посадових та службових осіб органів прокуратури."],"correct":0},{"num":28,"q":"Не пізніше якого терміну посадова особа Бюро економічної безпеки України, яка виявила у своєму службовому приміщенні майно, що може бути неправомірною вигодою або подарунком, зобов’язана письмово повідомити про цей факт свого безпосереднього керівника, згідно із Законом України «Про запобігання корупції»?","answers":["невідкладно, але не пізніше одного дня;","невідкладно, але не пізніше двох робочих днів;","невідкладно, але не пізніше одного робочого дня;","невідкладно, але не пізніше семи робочих днів."],"correct":2},{"num":29,"q":"До якого органу має право письмово звернутися особа, яка сумнівається у можливості одержання подарунка, для отримання консультації з цього питання, згідно із Законом України «Про запобігання корупції»?","answers":["до територіального органу Міністерства юстиції України;","до Спеціалізованої антикорупційної прокуратури;","до Національного антикорупційного бюро України;","до Національного агентства з питань запобігання корупції."],"correct":1},{"num":30,"q":"Яким видом оплачуваної діяльності не забороняється, згідно із Законом України «Про запобігання корупції» займатися посадовій особі Бюро економічної безпеки України?","answers":["час;","займатися іншою оплачуваною діяльністю за сумісництвом у неробочий входити до складу правління прибуткового підприємства як член виконавчого органу;","займатися викладацькою діяльністю у закладі вищої освіти за умови, що це не заважає виконанню основних службових обов’язків;","бути членом наглядової ради приватного банку без представництва держави."],"correct":2},{"num":31,"q":"Протягом якого терміну, після звільнення колишній посадовій особі Бюро економічної безпеки України, згідно із Законом України «Про запобігання корупції» забороняється представляти інтереси третіх осіб у справах, в яких іншою стороною є Бюро економічної безпеки України?","answers":["протягом двох років;","протягом п’яти років;","протягом року;","протягом шести місяців."],"correct":2},{"num":32,"q":"Протягом якого терміну у разі виникнення обставин, що порушують обмеження спільної роботи близьких осіб, посадова особа Бюро економічної безпеки України вживає заходів щодо їх усунення, згідно із Законом України «Про запобігання корупції»?","answers":["у п’ятнадцятиденний строк;","у п’ятиденний строк;","у двадцятиденний строк;","у десятиденний строк."],"correct":0},{"num":33,"q":"На яких осіб НЕ поширюються обмеження щодо спільної роботи близьких осіб, згідно із Законом України «Про запобігання корупції»?","answers":["на третейських суддів;","на суддів;","на осіб, які проживають у сільському населеному пункті, що є районним центром;","на народних засідателів і присяжних."],"correct":3},{"num":34,"q":"Який орган повинна повідомити особа, уповноважена на виконання функцій держави або місцевого самоврядування, про наявність у неї реального чи потенційного конфлікту інтересів у випадку перебування її на посаді, що НЕ передбачає наявності у неї безпосереднього керівника, згідно із Законом України «Про запобігання корупції»?","answers":["Спеціалізовану антикорупційну прокуратуру;","Національне агентство з питань запобігання корупції;","Національне антикорупційне бюро України;","Міністерство юстиції України."],"correct":1},{"num":35,"q":"Протягом якого терміну після отримання повідомлення про наявність у підлеглої йому особи реального чи потенційного конфлікту інтересів безпосередній керівник приймає рішення щодо його врегулювання, згідно із Законом України «Про запобігання корупції»?","answers":["протягом десяти робочих днів;","протягом трьох робочихднів;","протягом двох робочих днів;","на наступний робочий день."],"correct":2},{"num":36,"q":"Протягом якого терміну Національне агентство з питань запобігання корупції у випадку одержання від особи повідомлення про наявність у неї реального або потенційного конфлікту інтересів, роз’яснює їй порядок дій щодо його врегулювання, згідно із Законом України «Про запобігання корупції»?","answers":["упродовж п’яти робочих днів;","упродовж трьох робочих днів;","упродовж семи робочих днів;","упродовж десяти робочих днів."],"correct":2},{"num":37,"q":"До якого органу зобов’язана звернутися за роз’ясненням особа у разі існування сумнівів щодо наявності в неї конфлікту інтересів, згідно із Законом України «Про запобігання корупції»?","answers":["до Спеціалізованої антикорупційної прокуратури;","до Національного антикорупційного бюро України;","до територіального органу Міністерства юстиції України;","до Національного агентства з питань запобігання корупції."],"correct":3},{"num":38,"q":"В який спосіб здійснюється зовнішнє врегулювання конфлікту інтересів, згідно із Законом України «Про запобігання корупції»?","answers":["шляхом позбавлення спеціального чину або кваліфікаційного класу;","шляхом переведення на іншу посаду;","шляхом позбавлення спеціального звання, рангу;","шляхом відсторонення від посади."],"correct":1},{"num":39,"q":"В якому випадку застосовується усунення від виконання завдання як один зі способів зовнішнього врегулювання конфлікту інтересів, згідно із Законом України «Про запобігання корупції»?","answers":["якщо конфлікт інтересів не має постійного характеру;","якщо конфлікт інтересів має постійний характер; якщо особа не заперечує проти цього;","якщо особа прийняла рішення в умовах реального конфлікту інтересів."],"correct":0},{"num":40,"q":"Що із зазначеного є формою зовнішнього контролю за здійсненням повноважень особою, уповноваженою на виконання функцій держави або місцевого самоврядування, згідно із Законом України «Про запобігання корупції»?","answers":["перевірка керівником стану та результатів виконання особою завдань, що приймаються або розробляються особою або відповідним колегіальним органом з питань, пов’язаних із предметом конфлікту інтересів;","виконання особою завдання у присутності її керівника;","участь уповноваженої особи Національного агентства з питань запобігання корупції в роботі колегіального органу в статусі спостерігача з правом голосу;","участь уповноваженої особи Національного агентства з питань запобігання корупції в роботі колегіального органу в статусі спостерігача без права голосу."],"correct":3},{"num":41,"q":"Який із заходів зовнішнього врегулювання конфлікту інтересів може здійснюватися лише за згодою особи, уповноваженої на виконання функцій держави або місцевого самоврядування, згідно із Законом України «Про запобігання корупції»?","answers":["усунення особи від виконання завдання, вчинення дій, прийняття рішення чи участі в його прийнятті в умовах реального чи потенційного конфлікту інтересів;","звільнення особи;","переведення особи на іншу посаду;","перегляд обсягу службових повноважень особи."],"correct":0},{"num":42,"q":"Який із заходів зовнішнього врегулювання конфлікту інтересів може застосовуватися у випадку відсутності згоди особи на переведення або на позбавлення приватного інтересу, згідно із Законом України «Про запобігання корупції»?","answers":["обмеження доступу особи до певної інформації;","усунення особи від виконання завдання, вчинення дій, прийняття рішення чи участі в його прийнятті в умовах реального чи потенційного конфлікту інтересів;","звільнення особи;","перегляд обсягу службових повноважень особи."],"correct":2},{"num":43,"q":"Протягом якого терміну особа, яка має спеціальне звання Бюро економічної безпеки України зобов’язана після призначення на посаду передати в управління іншій особі належне йому підприємство чи корпоративні права, згідно із Законом України «Про запобігання корупції»?","answers":["протягом 20 днів;","протягом 10 днів;","протягом 15 днів;","протягом 60 днів."],"correct":2},{"num":44,"q":"Яким шляхом здійснюється передача посадовою особою Бюро економічної безпеки України, після призначення на посаду належного йому підприємства, яке за способом утворення (заснування) та формування статутного капіталу є унітарним, згідно із Законом України «Про запобігання корупції»?","answers":["укладення договору ренти;","укладення договору найму (оренди);","укладення договору управління майном із суб’єктом підприємницької діяльності;","укладення договору дарування."],"correct":0},{"num":45,"q":"Який орган затверджує загальні правила етичної поведінки державних службовців та посадових осіб місцевого самоврядування, згідно із Законом України «Про запобігання корупції»?","answers":["Національне агентство України з питань державної служби;","Кабінет Міністрів України;","Верховна Рада України;","Національне антикорупційне бюро України."],"correct":0},{"num":46,"q":"Чиї інтереси представляють особи, уповноважені на виконання функцій держави або місцевого самоврядування, згідно із Законом України «Про запобігання корупції»?","answers":["національних меншин;","Президента України;","держави чи територіальної громади;","органу держави."],"correct":2},{"num":47,"q":"На яких осіб НЕ поширюються вимоги щодо політичної нейтральності, згідно із Законом України «Про запобігання корупції»?","answers":["на виборних осіб та осіб, які обіймають політичні посади;","на посадових осіб місцевого самоврядування;","на державних службовців;","на посадових осіб юридичних осіб публічного права."],"correct":0},{"num":48,"q":"Що саме є змістом неупередженості, як вимоги до етичної поведінки осіб, уповноважених на виконання функцій держави або місцевого самоврядування, згідно із Законом України «Про запобігання корупції»?","answers":["діяти неупереджено, незважаючи на приватні інтереси, особисте ставлення до будь-яких осіб;","дотримуватися балансу державних та громадських інтересів;","відповідально виконувати службові повноваження;","не використовувати службові повноваження в інтересах окремих політиків."],"correct":0},{"num":49,"q":"Які дії має вчинити особа, яка має спеціальне звання Бюро економічної безпеки України у разі отримання для виконання незаконного рішення чи доручення, згідно із Законом України «Про запобігання корупції»?","answers":["негайно в письмовій формі повідомити про це керівника органу Бюро економічної безпеки України, в якому вона працює;","негайно в письмовій формі повідомити про це Національне антикорупційне бюро України;","негайно в письмовій формі повідомити про це Національне агентство з питань запобігання корупції;","негайно в письмовій формі повідомити про це органи Служби безпеки України."],"correct":3},{"num":50,"q":"Які дії мають вчинити виборні особи у разі отримання для виконання незаконного рішення чи доручення, згідно із Законом України «Про запобігання корупції»?","answers":["негайно в письмовій формі повідомити про це Національне антикорупційне бюро України або Державне бюро розслідувань;","негайно в письмовій формі повідомити про це органи прокуратури;","негайно в письмовій формі повідомити про це Національне агентство з питань запобігання корупції;","негайно в письмовій формі повідомити про це органи Служби безпеки України."],"correct":0},{"num":51,"q":"Яке правило НЕ визначено як вимога до етичної поведінки осіб, уповноважених на виконання функцій держави або місцевого самоврядування, у Законі України «Про запобігання корупції»?","answers":["компетентність і ефективність;","пріоритет інтересів;","політична нейтральність;","захист прав людини і громадянина."],"correct":3},{"num":52,"q":"Який Закон є правовою основою для кодексів чи стандартів професійної етики?","answers":["Закон України «Про засади державної антикорупційної політики на 2021- 2025 роки»:","Закон України «Про запобігання та протидію корупції»;","Закон України «Про Національне антикорупційне бюро України»;","Закон України «Про запобігання корупції»"],"correct":1},{"num":53,"q":"Яким органом визначається порядок здійснення моніторингу способу життя суб’єктів декларування, згідно із Законом України «Про запобігання корупції»?","answers":["Кабінетом Міністрів України;","Верховною Радою України;","Міністерством юстиції України;","Національним агентством з питань запобігання корупції."],"correct":0},{"num":54,"q":"Яким органом визначається форма декларації особи, уповноваженої на виконання функцій держави або місцевого самоврядування, згідно із Законом України «Про запобігання корупції»?","answers":["Національним агентством з питань запобігання корупції;","Міністерством юстиції України;","Верховною Радою України;","Національним агентством з питань державної служби."],"correct":0},{"num":55,"q":"На кого НЕ поширюються вимоги щодо подання декларацій осіб, уповноважених на виконання функцій держави або місцевого самоврядування, згідно із Законом України «Про запобігання корупції»?","answers":["на осіб, які не є державними службовцями;","на осіб рядового і начальницького складу органів внутрішніх справ, державної кримінально-виконавчої служби;","на державних службовців, посадових осіб місцевого самоврядування;","на депутатів місцевих рад, сільських, селищних, міських голів."],"correct":0},{"num":56,"q":"Протягом якого терміну Національне агентство з питань запобігання корупції надає можливість суб’єкту декларування виправити виявлені ним помилки у декларації особи, уповноваженої на виконання функцій держави або місцевого самоврядування, згідно із Законом України «Про запобігання корупції»?","answers":["упродовж п’яти календарних днів;","упродовж тридцяти календарних днів;","упродовж семи календарних днів;","упродовж двох тижнів."],"correct":1},{"num":57,"q":"До якого числа і якого місяця суб’єкти декларування зобов’язані щорічно подавати шляхом заповнення на офіційному веб-сайті Національного агентства з питань запобігання корупції декларацію особи, уповноваженої на виконання функцій держави або місцевого самоврядування, за минулий рік, згідно із Законом України «Про запобігання корупції»?","answers":["до 1 березня;","до 1 травня;","до 1 липня;","до 1 квітня."],"correct":3},{"num":58,"q":"У який термін суб’єкт декларування має письмово повідомити Національне агентство з питань запобігання корупції у разі відкриття ним або членом його сім’ї валютного рахунка в установі банку-нерезидента, згідно із Законом України «Про запобігання корупції»?","answers":["у семиденний строк;","у п’ятиденний строк;","у п’ятнадцятиденний строк;","у двадцятиденний строк."],"correct":3},{"num":59,"q":"Який орган визначає порядок здійснення моніторингу способу життя суб’єктів декларування, згідно із Законом України «Про запобігання корупції»?","answers":["Кабінет Міністрів України;","Верховна Рада України:","Національне агентство з питань запобігання корупції;","Міністерство юстиції України."],"correct":2},{"num":60,"q":"У чому полягає суттєва зміна у майновому стані суб’єкта декларування, що зобов’язує його письмово повідомити про це Національне агентство з питань запобігання корупції, згідно із Законом України «Про запобігання корупції»?","answers":["отримання ним доходу, придбання майна на суму, яка перевищує 75 прожиткових мінімумів, встановлених для працездатних осіб на 1 січня відповідного року;","отримання ним доходу, придбання майна на суму, яка перевищує 25 прожиткових мінімумів, встановлених для працездатних осіб на 1 січня відповідного року;","отримання ним доходу, придбання майна на суму, яка перевищує 100 прожиткових мінімумів, встановлених для працездатних осіб на 1 січня відповідного року;","отримання ним доходу, придбання майна на суму, яка перевищує 50 прожиткових мінімумів, встановлених для працездатних осіб на 1 січня відповідного року."],"correct":3},{"num":61,"q":"Декларації яких осіб, уповноважених на виконання функцій держави або місцевого самоврядування, підлягають обов’язковій повній перевірці, згідно із Законом України «Про запобігання корупції»?","answers":["тільки декларації службових осіб, які займають відповідальне та особливо відповідальне становище, суб’єктів декларування, які займають посади, пов’язані з високим рівнем корупційних ризиків, перелік яких затверджується Національним агентством з питань запобігання корупції;","тільки декларації службових осіб юридичних осіб публічного права, які займають посади, пов’язані з високим рівнем корупційних ризиків, перелік яких затверджується Національним агентством з питань запобігання корупції;","тільки декларації осіб, які здійснюють професійну діяльність, пов’язану із наданням публічних послуг;","тільки декларації службових осіб юридичних осіб приватного права, які є учасниками процедури закупівлі."],"correct":0},{"num":62,"q":"Здійснення моніторингу способу життя суб’єктів декларування, обмежується необхідністю додержання такого законодавства:","answers":["законодавства про захист персональних даних;","законодавства у сфері захисту інтелектуальної власності;","кримінального законодавства України;","кримінального процесуального законодавства України."],"correct":0},{"num":63,"q":"Хто саме здійснює вибірковий моніторинг способу життя суб’єктів декларування з метою встановлення відповідності їх рівня життя наявним у них та членів їхньої сім’ї майну і одержаним ними доходам, згідно з декларацією особи, уповноваженої на виконання функцій держави або місцевого самоврядування, згідно із Законом України «Про запобігання корупції»?","answers":["Національне антикорупційне бюро України;","Національне агентство з питань запобігання корупції;","керівник підприємства, установи, організації;","Бюро економічної безпеки України."],"correct":1},{"num":64,"q":"Який орган формує та веде Єдиний державний реєстр декларацій осіб, уповноважених на виконання функцій держави або місцевого самоврядування, згідно із Законом України «Про запобігання корупції»?","answers":["Національне агентство з питань запобігання корупції;","Національне антикорупційне бюро України;","Міністерство юстиції України;","Державне бюро розслідувань."],"correct":0},{"num":65,"q":"Який орган забезпечує ведення Єдиного порталу повідомлень викривачів, згідно із Законом України «Про запобігання корупції»?","answers":["Державне бюро розслідувань;","Спеціалізована антикорупційна прокуратура;","Національне агентство з питань запобігання корупції;","Національне антикорупційне бюро України."],"correct":0},{"num":66,"q":"Який орган забезпечує ведення Реєстру прозорості, згідно із Законом України «Про запобігання корупції»?","answers":["Міністерство юстиції України;","Спеціалізована антикорупційна прокуратура;","Національне агентство з питань запобігання корупції;","Національне антикорупційне бюро України."],"correct":2},{"num":67,"q":"Ким визнається особа, яка за наявності обґрунтованого переконання в тому, що інформація є достовірною, повідомляє про порушення вимог Закону України «Про запобігання корупції» іншою особою?","answers":["викривачем;","провокатором;","доповідачем;","інформатором."],"correct":0},{"num":68,"q":"Яке дослідження проводиться з метою виявлення в чинних нормативно\u0002правових актах і проектах нормативно-правових актів факторів, що сприяють або можуть сприяти вчиненню корупційних правопорушень, розроблення рекомендацій стосовно їх усунення, згідно із Законом України «Про запобігання корупції»?","answers":["кримінологічна експертиза;","антикорупційна експертиза;","антикорупційний аналіз;","правова експертиза."],"correct":1},{"num":69,"q":"Яким органом здійснюється антикорупційна експертиза проєктів нормативно-правових актів, внесених на розгляд Верховної Ради України народними депутатами України?","answers":["Національним агентством з питань запобігання корупції;","Міністерством юстиції України;","Комітетом Верховної Ради України, до предмета відання якого належить питання боротьби з корупцією;","Головним науково-експертним управлінням апарату Верховної Ради України."],"correct":2},{"num":70,"q":"Якщо особа, яка ознайомилася з довідкою про результати проведення щодо неї спеціальної перевірки, НЕ погодилася з цими результатами, то в який спосіб вона може висловити свою незгоду з результатами перевірки, згідно із Законом України «Про запобігання корупції»?","answers":["подати відповідному органу державної влади, органу місцевого самоврядування свої зауваження у письмовій формі;","подати відповідному органу державної влади, органу місцевого самоврядування свої зауваження в усній формі;","подати відповідному органу державної влади, органу місцевого самоврядування свої письмові пояснення;","подати відповідному органу державної влади, органу місцевого самоврядування клопотання про проведення повторної спеціальної перевірки."],"correct":0},{"num":71,"q":"Який орган може проводити за власною ініціативою у встановленому ним порядку антикорупційну експертизу проектів нормативно-правових актів, що вносяться на розгляд Верховної Ради України або Кабінету Міністрів України, згідно із Законом України «Про запобігання корупції»?","answers":["Верховна Рада України;","Національне агентство з питань запобігання корупції;","Національне антикорупційне бюро України;","Міністерство юстиції України."],"correct":2},{"num":72,"q":"Який орган здійснює періодичний перегляд законодавства на наявність у ньому корупціогенних норм, згідно із Законом України «Про запобігання корупції»?","answers":["Міністерство юстиції України;","Національне антикорупційне бюро України;","Верховна Рада України;","Національне агентство з питань запобігання корупції."],"correct":3},{"num":73,"q":"Щодо законів України, актів Президента України та Кабінету Міністрів України у якій саме сфері здійснюється антикорупційна експертиза, згідно із Законом України «Про запобігання корупції»?","answers":["конкурсних (тендерних) процедур;","обороноздатності держави;","національної безпеки України;","криміналізації."],"correct":0},{"num":74,"q":"Що саме є підставою для зупинення на строк до 10 днів процедури розгляду або прийняття проекту нормативно-правового акту, який перебуває на розгляді Верховної Ради України або Кабінету Міністрів України, згідно із Законом України «Про запобігання корупції»?","answers":["висновок Національного агентства з питань запобігання корупції щодо виявлення у проекті нормативно-правового акту корупціогенних факторів;","інформування Національним агентством з питань запобігання корупції відповідного комітету Верховної Ради України або Кабінету Міністрів України про проведення антикорупційної експертизи;","припис Національного агентства з питань запобігання корупції;","лист Громадської ради при Національному агентстві з питань запобігання корупції про початок здійснення нею антикорупційної експертизи проекту нормативно-правового акту."],"correct":0},{"num":75,"q":"Ким затверджується перелік посад з підвищеним корупційним ризиком, згідно із Законом України «Про запобігання корупції»?","answers":["Національним агентством з питань запобігання корупції;","Національним антикорупційним бюро України;","Міністерством юстиції України;","Верховною Радою України."],"correct":0},{"num":76,"q":"На кого покладається організація проведення спеціальної перевірки, згідно із Законом України «Про запобігання корупції»?","answers":["на центральний орган виконавчої влади, що забезпечує формування та реалізує державну політику у сфері державної служби;","на спеціально створений орган з питань проведення спеціальної перевірки;","на керівника (заступника керівника) державного органу, органу місцевого самоврядування, на зайняття посади в якому претендує особа;","на спеціально уповноваженого працівника Національного агентства з питань запобігання корупції."],"correct":2},{"num":77,"q":"У який строк проводиться спеціальна перевірка, згідно із Законом України «Про запобігання корупції»?","answers":["у строк, що не перевищує десяти календарних днів з дня надання згоди на проведення спеціальної перевірки;","у строк, що не перевищує шістдесяти календарних днів з дня надання згоди на проведення спеціальної перевірки;","у строк, що не перевищує дев’яносто календарних днів з дня надання згоди на проведення спеціальної перевірки;","у строк, що не перевищує двадцяти п’яти календарних днів з дня надання згоди на проведення спеціальної перевірки."],"correct":3},{"num":78,"q":"Який правовий наслідок має місце у випадку, якщо особа, яка претендує на зайняття посади, НЕ надала згоду на проведення щодо неї спеціальної перевірки, якщо така перевірка згідно із законодавством є обов’язковою, згідно із Законом України «Про запобігання корупції»?","answers":["це не впливає на вирішення питання щодо призначення її на посаду;","питання щодо призначення її на посаду вирішується колегіально;","питання щодо призначення її на посаду не розглядається упродовж одного місяця;","питання щодо призначення її на посаду не розглядається."],"correct":3},{"num":79,"q":"Яким органом затверджується Порядок проведення спеціальної перевірки та форма згоди на її проведення, згідно із Законом України «Про запобігання корупції»?","answers":["Кабінетом Міністрів України;","Верховною Радою України;","Національним агентством з питань запобігання корупції;","Національним антикорупційним бюро України."],"correct":0},{"num":80,"q":"Яким органом проводиться спеціальна перевірка щодо наявності в особи корпоративних прав, згідно із Законом України «Про запобігання корупції»?","answers":["Національним агентством з питань запобігання корупції, Службою безпеки України;","Міністерством внутрішніх справ України і Державною судовою адміністрацією України;","Міністерством юстиції України і Національною комісією з цінних паперів та фондового ринку."],"correct":2},{"num":81,"q":"Яким органом проводиться спеціальна перевірка щодо відомостей про притягнення особи до кримінальної відповідальності, наявність судимості, її зняття, погашення, згідно із Законом України «Про запобігання корупції»?","answers":["Міністерством юстиції України і Національною комісією з цінних паперів та фондового ринку;","Службою безпеки України;","Національним агентством з питань запобігання корупції;","Міністерством внутрішніх справ України і Державною судовою адміністрацією України."],"correct":3},{"num":82,"q":"Протягом якого терміну подається інформація про результати спеціальної перевірки до органу, який надіслав запит про її проведення, згідно із Законом України «Про запобігання корупції»?","answers":["у десятиденний строк з дати надходження запиту;","у п’ятнадцятиденний строк з дати надходження запиту; у п’ятиденний строк з дати надходження запиту;","у семиденний строк з дати надходження запиту."],"correct":2},{"num":83,"q":"Яке рішення повинна прийняти посадова особа, яка здійснює призначення (обрання) на посаду, у разі встановлення за результатами спеціальної перевірки відомостей про претендента на посаду, які НЕ відповідають визначеним у законодавстві вимогам для зайняття посади, згідно із Законом України «Про запобігання корупції»?","answers":["призначає претендента на посаду;","відмовляє претенденту у призначенні (обранні) на посаду;","повідомляє протягом трьох робочих днів про виявлений факт правоохоронні органи та відмовляє претенденту у призначенні (обранні) на посаду;","дає можливість претенденту на посаду протягом п’яти робочих днів надати письмове пояснення за таким фактом та/або виправити невідповідність."],"correct":1},{"num":84,"q":"Протягом якого терміну Уповноважений (особа, відповідальна за реалізацію антикорупційної програми) зобов’язаний повідомити керівника юридичної особи про виникнення обставин несумісності з одночасним поданням заяви про розірвання трудового договору за власною ініціативою, згідно із Законом України «Про запобігання корупції»?","answers":["у дводенний строк з дня виникнення таких обставин;","у п’ятиденний строк з дня виникнення таких обставин;","у триденний строк з дня виникнення таких обставин;","впродовж двадцяти чотирьох годин з дня виникнення таких обставин."],"correct":0},{"num":85,"q":"Який орган повинен письмово повідомити керівник юридичної особи про звільнення Уповноваженого (особи, відповідальної за реалізацію антикорупційної програми), згідно із Законом України «Про запобігання корупції»?","answers":["Міністерство юстиції України;","Бізнес-омбудсмена;","Національне агентство з питань запобігання корупції;","Комітет Верховної Ради України з питань антикорупційної політики."],"correct":2},{"num":86,"q":"Протягом якого терміну керівник юридичної особи письмово повідомляє Національне агентство з питань запобігання корупції про звільнення особи з посади Уповноваженого (особи, відповідальної за реалізацію антикорупційної програми), згідно із Законом України «Про запобігання корупції»?","answers":["протягом трьох робочих днів;","упродовж двадцяти чотирьох годин;","у п’ятиденний строк;","протягом двох робочих днів."],"correct":3},{"num":87,"q":"Що повинен одночасно зробити Уповноважений (особа, відповідальна за реалізацію антикорупційної програми) у разі виникнення обставин несумісності, окрім повідомлення про це керівника юридичної особи, згідно із Законом України «Про запобігання корупції»?","answers":["інформувати Національне антикорупційне бюро України;","подати заяву про переведення на іншу посаду;","направити подання у Національне агентство з питань запобігання корупції;","подати заяву про розірвання трудового договору за власною ініціативою."],"correct":3},{"num":88,"q":"Що має передувати затвердженню антикорупційної програми юридичної особи згідно із Законом України «Про запобігання корупції»?","answers":["надходження висновку Національного антикорупційного бюро України;","надходження висновку Національного агентства з питань запобігання корупції;","обговорення її з працівниками юридичної особи;","публікація у місцевих періодичних друкованих виданнях."],"correct":2},{"num":89,"q":"Яка особа НЕ може бути призначена на посаду Уповноваженого (особи, відповідальної за реалізацію антикорупційної програми), згідно із Законом України «Про запобігання корупції»?","answers":["яка має непогашену чи не зняту в установленому законом порядку судимість;","яка упродовж шести місяців притягувалася до дисциплінарної відповідальності;","яка упродовж року притягувалася до адміністративної відповідальності;","яка упродовж двох років притягувалася до адміністративної відповідальності."],"correct":0},{"num":90,"q":"В якому режимі повинен перебувати текст антикорупційної програми юридичної особи, згідно із Законом України «Про запобігання корупції»?","answers":["у таємному користуванні Уповноваженого юридичної особи;","на стенді в кабінетах керівників юридичної особи;","в обмеженому доступі для працівників юридичної особи;","у постійному відкритому доступі для працівників юридичної особи."],"correct":3},{"num":91,"q":"В якому документі передбачається порядок призначення Уповноваженого (особи, відповідальної за реалізацію антикорупційної програми), згідно із Законом України «Про запобігання корупції»?","answers":["у наказі керівника юридичної особи;","у посадовій інструкції;","в ухваленій в юридичній особі антикорупційній програмі;","в Законі України «Про запобігання корупції»."],"correct":2},{"num":92,"q":"Які особи можуть бути залучені для виявлення та усунення корупційних ризиків у діяльності юридичної особи, згідно із Законом України «Про запобігання корупції»?","answers":["члени трудового арбітражу;","експерти;","незалежні посередники;","оцінювачі."],"correct":1},{"num":93,"q":"Хто із вказаних у переліку осіб забезпечує здійснення регулярної оцінки корупційних ризиків у діяльності юридичної особи, згідно із Законом України «Про запобігання корупції»?","answers":["керівник, засновники (учасники) юридичної особи;","незалежні посередники;","незалежні експерти;","члени трудового арбітражу."],"correct":0},{"num":94,"q":"Який правовий статус має Уповноважений (особа, відповідальна за реалізацію антикорупційної програми), згідно із Законом України «Про запобігання корупції»?","answers":["керівник юридичної особи;","відряджений представник Національного агентства з питань запобігання корупції;","посадова особа юридичної особи;","постійний представник Національного агентства з питань запобігання корупції."],"correct":2},{"num":95,"q":"Що має забезпечити керівник юридичної особи у випадку звільнення з посади Уповноваженого (особи, відповідальної за реалізацію антикорупційної програми), окрім письмового повідомлення про це Національному агентству з питань запобігання корупції, згідно із Законом України «Про запобігання корупції»?","answers":["подання нової кандидатури на вказану посаду протягом двох робочих днів;","скорочення вказаної посади;","невідкладне подання нової кандидатури на вказану посаду;","покладення виконання обов’язків Уповноваженого на іншого працівника підприємства."],"correct":2},{"num":96,"q":"Хто може бути Уповноваженим (особою, відповідальною за реалізацію антикорупційної програми юридичної особи), згідно з Законом України «Про запобігання корупції»?","answers":["громадянин України, який має вищу юридичну освіту та стаж роботи у галузі права три роки;","фізична особа, яка здатна за своїми діловими та моральними якостями, професійним рівнем, станом здоров’я виконувати відповідні обов’язки;","фізична особа, яка склала кваліфікаційний іспит, має сертифікат та включена у Єдиний реєстр осіб, які можуть бути Уповноваженим (особою, відповідальною за реалізацію антикорупційної програми);","громадянин України, який має досвід роботи у спеціально уповноваженому органі у сфері протидії корупції протягом п’яти років."],"correct":1},{"num":97,"q":"Вкажіть, які правовізаходи можуть застосовуватися до юридичної особи у разі вчинення її уповноваженою особою злочину від імені та в інтересах юридичної особи, згідно із Законом України «Про запобігання корупції»?","answers":["тільки заходи адміністративно-правового характеру;","виправні заходи;","тільки заходи цивільно-правової відповідальності;","заходи кримінально-правового характеру."],"correct":0},{"num":98,"q":"Яким є порядок відсторонення від виконання службових повноважень осіб, щодо яких складено протокол про адміністративне правопорушення, пов’язане з корупцією, згідно із Законом України «Про запобігання корупції»?","answers":["особа може бути відсторонена від виконання службових повноважень за рішенням суду до закінчення розгляду справи судом;","особа може бути відсторонена від виконання службових повноважень за рішенням прокурора на строк не менше 6 місяців;","особа може бути відсторонена від виконання службових повноважень за рішенням керівника органу (установи, підприємства, організації), в якому така особа працює, до закінчення розгляду справи судом;","особа може бути відсторонена від виконання службових повноважень за рішенням керівника органу (установи, підприємства, організації), в якому така особа працює, на строк не менше 6 місяців."],"correct":2},{"num":99,"q":"Яка обов’язкова вимога повинна дотримуватися при наданні компетентними органами України органам іноземних держав інформації з питань, пов’язаних із запобіганням і протидією корупції, згідно із Законом України «Про запобігання корупції»?","answers":["встановлення такого режиму доступу до інформації, який дає змогу її розголошення виключно в інтересах національної та економічної безпеки іноземних держав;","встановлення такого режиму доступу до інформації, який унеможливлює розкриття інформації для інших цілей чи її розголошення у будь-який спосіб;","встановлення такого режиму доступу до інформації, який дає змогу забезпечувати зареєстрованим користувачам вільний доступ до такої інформації, встановлення такого режиму доступу до інформації, який забезпечує вільне отримання, поширення та будь-яке інше використання інформації."],"correct":0},{"num":100,"q":"Вкажіть, які з наведених у переліку повноважень відповідно до Закону України «Про запобігання корупції» належать до повноважень Національного агентства з питань запобігання корупції?","answers":["координація виконання міжнародних зобов’язань у сфері формування та реалізації антикорупційної політики;","координація виконання органами державного фінансового контролю міжнародних договорів у сфері протидії корупції;","координація діяльності місцевих органів виконавчої влади щодо міжнародних договорів у сфері протидії корупції;","координація діяльності органів державного фінансового контролю щодо міжнародних договорів у сфері реалізації антикорупційної політики."],"correct":0},{"num":101,"q":"Вкажіть, що із наведеного має застосовуватися у разі, якщо міжнародними договорами, згоду на обов’язковість яких надано Верховною Радою України, встановлено інші правила, ніж ті, що передбачені національним законодавством про запобігання і протидію корупції?","answers":["нормативні акти Ради Європи;","законодавство України про запобігання і протидію корупції;","правила міжнародних договорів у тій частині, що не суперечить законодавству України про запобігання і протидію корупції;","правила міжнародних договорів, згоду на обов’язковість яких надано Верховною Радою України."],"correct":3},{"num":102,"q":"До повноважень якого державного органу належить забезпечення ведення Єдиного державного реєстру осіб, які вчинили корупційні або пов’язані з корупцією правопорушення?","answers":["Національного антикорупційного бюро України;","Державної судової адміністрації України;","Національного агентства з питань запобігання корупції;","Міністерства юстиції України."],"correct":2},{"num":103,"q":"У який строк затверджується державна антикорупційна програма з виконання Антикорупційної стратегії?","answers":["у шестимісячний строк з дня набрання чинності законом, яким затверджено Антикорупційну стратегію;","у шестимісячний строк з дня набрання чинності постановою, яким затверджено Антикорупційну стратегію;","у п’ятимісячний строк з дня набрання чинності законом, яким затверджено Антикорупційну стратегію;","у п’ятимісячний строк з дня набрання чинності постановою, якою затверджено Антикорупційну стратегію."],"correct":0},{"num":104,"q":"На розгляд якого органу вноситься проект державної антикорупційної програми з виконання Антикорупційної стратегії?","answers":["Національне агентство з питань запобігання корупції;","Міністерство юстиції України;","Кабінет Міністрів України;","Верховна Рада країни."],"correct":2},{"num":105,"q":"У який строк суб’єкт декларування, що не подав декларацію, після письмового повідомлення Національного агентства про факт неподання декларації повинен подати декларацію в порядку, визначеному частиною першою статті 45 Закону України «Про запобігання корупції»?","answers":["протягом десяти днів з дня отримання такого повідомлення;","протягом тридцяти днів з дня отримання такого повідомлення;","протягом шістдесяти днів з дня отримання такого повідомлення;","протягом п’яти днів з дня отримання такого повідомлення."],"correct":0},{"num":106,"q":"Який розмір винагороди викривачу встановлений Законом України «Про запобігання корупції»?","answers":["розмір винагороди становить 10 відсотків від грошового розміру предмета корупційного злочину або розміру завданих державі збитків від злочину після ухвалення обвинувального вироку суду. Розмір винагороди не може перевищувати трьох тисяч мінімальних заробітних плат, установлених на час вчинення злочину;","розмір винагороди становить 50 відсотків від грошового розміру предмета корупційного злочину або розміру завданих державі збитків від злочину після ухвалення обвинувального вироку суду. Розмір винагороди не може перевищувати трьох тисяч мінімальних заробітних плат, установлених на час вчинення злочину;","розмір винагороди становить 20 відсотків від грошового розміру предмета корупційного злочину або розміру завданих державі збитків від злочину після ухвалення обвинувального вироку суду. Розмір винагороди не може перевищувати п’яти тисяч мінімальних заробітних плат, установлених на час вчинення злочину;","розмір винагороди становить 15 відсотків від грошового розміру предмета корупційного злочину або розміру завданих державі збитків від злочину після ухвалення обвинувального вироку суду. Розмір винагороди не може перевищувати двох тисяч мінімальних заробітних плат, установлених на час вчинення злочину."],"correct":0},{"num":107,"q":"У який строк суб’єкт декларування у разі суттєвої зміни у майновому стані, а саме отримання доходу, придбання майна або здійснення видатку на суму, яка перевищує 50 прожиткових мінімумів, встановлених для працездатних осіб на 1 січня відповідного року, зобов’язаний повідомити про це Національне агентство?","answers":["у тридцятиденний строк з моменту отримання доходу, придбання майна або здійснення видатку;","у шістдесятиденний строк з моменту отримання доходу, придбання майна або здійснення видатку;","у п’ятнадцятиденний строк з моменту отримання доходу, придбання майна або здійснення видатку;","у десятиденний строк з моменту отримання доходу, придбання майна або здійснення видатку."],"correct":3},{"num":108,"q":"Яку кількість разів суб’єкт декларування може подати виправлену декларацію?","answers":["двічі;","одноразово;","необмежену кількість разів у межах звітного періоду кампанії декларування;","не більше трьох разів."],"correct":1},{"num":109,"q":"Який строк зберігання відомостей в Єдиному державному реєстрі осіб, які вчинили корупційні або пов’язані з корупцією правопорушення, відомостей про притягнення до кримінальної відповідальності фізичної особи за вчинення корупційних або пов’язаних з корупцією правопорушень?","answers":["до погашення або зняття судимості з особи та один рік після;","два роки;","безстроково;","до погашення або зняття судимості з особи."],"correct":0},{"num":110,"q":"В яких формах здійснюється зовнішній контроль:","answers":["перевірка працівником, визначеним керівником органу, підприємства, установи, організації, стану та результатів виконання особою завдання, вчинення нею дій, змісту рішень чи проектів рішень, що приймаються або розробляються особою або відповідним колегіальним органом з питань, пов’язаних із предметом конфлікту інтересів;","виконання особою завдання, вчинення нею дій, розгляд справ, підготовка та прийняття нею рішень у присутності визначеного керівником органу працівника;","участь уповноваженої особи Національного агентства в роботі колегіального органу в статусі спостерігача без права голосу;","всі відповіді вірні."],"correct":3},{"num":111,"q":"Особа, яка вчинила корупційне правопорушення або правопорушення, пов’язане з корупцією, однак судом не застосовано до неї покарання або не накладено на неї стягнення у виді позбавлення права обіймати певні посади або займатися певною діяльністю, пов’язаними з виконанням функцій держави або місцевого самоврядування, або такою, що прирівнюється до цієї діяльності, підлягає притягненню до відповідальності у встановленому законом порядку:","answers":["дисциплінарної;","кримінальної;","адміністративної;","дисциплінарної та адміністративної."],"correct":0},{"num":112,"q":"Активи, набуті внаслідок вчинення корупційного правопорушення, підлягають:","answers":["конфіскації або спеціальній конфіскації за рішенням суду в установленому законом порядку;","підлягають конфіскації в установленому законом порядку;","не підлягають конфіскації або спеціальній конфіскації за рішенням суду;","підлягають спеціальній конфіскації в порядку визначеному законом."],"correct":0},{"num":113,"q":"Яке з наведених обмежень передбачене Законом України «Про запобігання корупції?","answers":["заборона мати рахунок у банку - нерезидента;","заборона одержувати подарунки понад установленому вартість;","заборона користуватися майном близьких осіб;","заборона роботи по сумісництву."],"correct":1},{"num":114,"q":"Інформація про особу в Єдиному державному реєстрі декларацій осіб, уповноважених на виконання функцій держави або місцевого самоврядування, зберігається упродовж всього часу виконання цією особою функцій держави або місцевого самоврядування, а також упродовж п’яти років після припинення виконання нею зазначених функцій, крім останньої декларації, поданої особою, яка зберігається:","answers":["один рік;","три роки;","п’ять років;","безстроково."],"correct":3},{"num":115,"q":"Чи може суб’єкт декларування передати корпоративні права в управління іншій особі?","answers":["ні;","так, шляхом передачі в управління;","лише за рішенням суду;","лише за договором НАЗК."],"correct":1},{"num":116,"q":"Викривач, його близькі особи, переведені на іншу постійну нижчеоплачувану роботу (посаду) у зв’язку з повідомленням про можливі факти корупційних або пов’язаних з корупцією правопорушень, інших порушень цього Закону, підлягають:","answers":["негайному поновленню на попередній роботі (посаді), а також їм виплачується різниця в заробітку за час виконання нижчеоплачуваної роботи, але не більш як за один рік;","звільненню;","негайному поновленню на попередній роботі (посаді) чи переведенню на іншу рівнозначну посаду;","відсторонення від займаної посади."],"correct":0},{"num":117,"q":"Подання повідомлень (у тому числі анонімних) через внутрішні канали повідомлення про можливі факти корупційних або пов’язаних з корупцією правопорушень, інших порушень Закону України «Про запобігання корупції» здійснюється через:","answers":["відкритий для цілодобового доступу Єдиний портал повідомлень викривачів та спеціальні телефонні лінії;","направлення повідомлення, у тому числі анонімного, у паперовій або електронній формі;","здійснення повідомлення на особистому прийомі, через спеціальну телефонну лінію;","Єдиний портал повідомлень викривачів."],"correct":0},{"num":118,"q":"Що є дисциплінарним проступком у сфері запобігання корупції?","answers":["повідомлення про конфлікт інтересів;","неповідомлення про наявність конфлікту інтересів відмова від подарунка;","подання декларації."],"correct":1},{"num":119,"q":"Що з наведеного є приватним інтересом?","answers":["виконання наказу керівника;","отримання доходу членом сім’ї від підприємства, щодо якого посадова особа приймає рішення;","застосування загальнодержавних пільг;","службова необхідність."],"correct":1},{"num":120,"q":"Працівник отримав подарунок від організації, яка бере участь у тендері, що очолює цей працівник. Чи дозволено приймати подарунок?","answers":["так, якщо менше 50% прожиткового мінімуму;","ні, це порушення антикорупційного законодавства;","так, якщо повідомити керівника;","лише письмово."],"correct":1},{"num":121,"q":"Працівник отримав дохід від здачі в оренду квартири, яка належить його дружині. Що слід зробити?","answers":["не декларувати, бо майно не належить йому на праві власності;","задекларувати дохід, оскільки це майно близької особи;","декларувати лише якщо сума доходу понад 150 тис. грн;","декларувати лише за вимогою керівника."],"correct":1},{"num":122,"q":"Працівник державного органу придбав криптовалюту. Які обов’язки щодо декларування передбачає Закон України «Про запобігання корупції»?","answers":["не декларувати;","декларувати як нематеріальний актив у щорічній декларації;","декларувати лише при продажу;","лише на вимогу керівника.","Закон України «"],"correct":1}]},{"name":"Закон України «Про Кабінет Міністрів України»","questions":[{"num":1,"q":"В якій формі, видаються акти Кабінету Міністрів України нормативного характеру?","answers":["постанов або розпоряджень Кабінету Міністрів України;","декретів Кабінету Міністрів України;","постанов Кабінету Міністрів України;","розпоряджень Кабінету Міністрів України."],"correct":2},{"num":2,"q":"В якій формі, видаються акти Кабінету Міністрів України з організаційно-розпорядчих та інших поточних питань?","answers":["постанов або розпоряджень Кабінету Міністрів України;","декретів Кабінету Міністрів України;","постанов Кабінету Міністрів України;","розпоряджень Кабінету Міністрів України."],"correct":3},{"num":3,"q":"Коли набувають чинності постанови Кабінету Міністрів України, крім постанов, що містять інформацію з обмеженим доступом?","answers":["через 10 днів з дня їх офіційного опублікування, якщо інше не передбачено самими постановами;","через 7 днів з дня їх офіційного опублікування, якщо інше не передбачено самими постановами;","з дня їх офіційного опублікування, якщо інше не передбачено самими постановами, але не раніше дня їх опублікування;","через 3 дні з дня їх офіційного опублікування, якщо інше не передбачено самими постановами."],"correct":2},{"num":4,"q":"Чи має Бюро економічної безпеки України право ініціативи у прийнятті актів Кабінету Міністрів України?","answers":["так, має таке право;","ні, таке право може виникати лише за погодженням з Міністерством фінансів України;","так, має право ініціювати прийняття актів тільки з організаційно-розпорядчих та інших поточних питань;","ні, не має такого права."],"correct":0},{"num":5,"q":"Що належить до повноважень Кабінету Міністрів України у відносинах з центральними органами виконавчої влади?","answers":["лише Кабінет Міністрів України забезпечує спрямування роботи центральних органів виконавчої влади;","Кабінет Міністрів України спрямовує і координує роботу центральних органів виконавчої влади;","лише Кабінет Міністрів України координує роботу центральних органів виконавчої влади;","Кабінет Міністрів України здійснює загальне керівництво і координує роботу центральних органів виконавчої влади."],"correct":1},{"num":6,"q":"До якої категорії посад належать посади членів Кабінету Міністрів України?","answers":["до політичних посад;","до посад державної служби;","до вищих державних посад;","до посад з високим рівнем відповідальності"],"correct":0},{"num":7,"q":"Ким призначається на посаду Прем'єр-міністр України?","answers":["Верховною Радою України за поданням Президента України","Президентом за погодженням з Верховною Радою","Головою Верховної Ради України","Президентом України"],"correct":0},{"num":8,"q":"Ким скликаються засідання Кабінету Міністрів України?","answers":["Першим віце-прем'єр-міністром України","Секретарем Кабінету Міністрів України","один із міністрів в порядку черговості","Прем'єр-міністром України"],"correct":3},{"num":9,"q":"Який підрозділ здійснює організаційне, експертно-аналітичне, правове, інформаційне та матеріально-технічне забезпечення діяльності Кабінету Міністрів України?","answers":["Спеціальний структурний підрозділ Кабінету Міністрів України","Секретаріат Кабінету Міністрів України","Апарат Кабінету Міністрів України","Державне управління справами"],"correct":1}]},{"name":"Закон України «Про доступ до публічної інформації»","questions":[{"num":1,"q":"У якому порядку вирішуються спори фізичних чи юридичних осіб із розпорядником публічної інформації щодо оскарження його рішень, дій чи бездіяльності у частині доступу до публічної інформації?","answers":["у порядку господарського судочинства;","у порядку адміністративного судочинства;","у порядку цивільного судочинства;","у порядку кримінального судочинства."],"correct":1},{"num":2,"q":"Яка інформація визнається конфіденційною інформацією, згідно із Законом України «Про доступ до публічної інформації»?","answers":["інформація, зібрана в процесі оперативно-розшукової, контррозвідувальної діяльності, у сфері оборони країни, яку не віднесено до державної таємниці;","інформація, яка містить державну, професійну банківську таємницю, таємницю досудового розслідування та іншу передбачену законом таємницю;","інформація, доступ до якої обмежено фізичною або юридичною особою, крім суб'єктів владних повноважень, та яка може поширюватися у визначеному ними порядку за їхнім бажанням відповідно до передбачених ними умов;","інформація щодо діяльності та фінансового стану клієнта, яка стала відомою банку у процесі обслуговування клієнта та взаємовідносин з ним чи третім особам при наданні послуг банку."],"correct":2},{"num":3,"q":"Яка інформація визнається конфіденційною інформацією, згідно із Законом України «Про доступ до публічної інформації»?","answers":["запитувачі інформації;","структурний підрозділ або відповідальна особа з питань доступу до публічної інформації розпорядників інформації;","розпорядники інформації;","розповсюджувачі інформації."],"correct":3},{"num":4,"q":"Хто з наведених у переліку суб'єктів НЕ належить до суб'єктів відносин у сфері доступу до публічної інформації, згідно із Законом України «Про доступ до публічної інформації»?","answers":["систематично вести облік документів, що знаходяться в їхньому володінні;","завіряти копії документів на вимогу запитувача інформації;","мати спеціальні структурні підрозділи або призначати відповідальних осіб для забезпечення доступу запитувачів до інформації та оприлюднення інформації;","вести облік запитів на інформацію."],"correct":1},{"num":5,"q":"Що з наведеного переліку НЕ належить до обов'язків розпорядників інформації відповідно до Закону України «Про доступ до публічної інформації»?","answers":["доказова база;","ім'я (найменування) запитувача;","причини подання запиту;","відомості, яким чином ця інформація стосується особисто запитувача."],"correct":1},{"num":6,"q":"Що з наведеного у переліку має бути обов'язково зазначено у запиті на інформацію відповідно до Закону України «Про доступ до публічної інформації»?","answers":["невідкладно;","не пізніше 5 робочих днів з дня отримання запиту;","не пізніше 10-денного строку з дня отримання запиту;","не пізніше 72 годин з моменту отримання запиту."],"correct":1},{"num":7,"q":"Протягом якого загального строку розпорядник інформації має надати відповідь на запит на інформацію відповідно до Закону України «Про доступ до публічної інформації»?","answers":["залишити цей запит без розгляду;","клопотати про відстрочку у розгляді запиту;","надіслати цей запит належному розпоряднику інформації;","відмовити в задоволенні запиту."],"correct":3},{"num":8,"q":"На що із зазначеного має право розпорядник інформації, який НЕ володіє і НЕ зобов'язаний відповідно до його компетенції володіти інформацією, щодо якої відповідно до Закону України «Про доступ до публічної інформації зроблено запит»?","answers":["виключно в письмовій формі;","в тій же формі, в якій зроблено запит;","у письмовій формі або електронною поштою;","у письмовій або усній формі чи електронною поштою."],"correct":0},{"num":9,"q":"Що таке таємна інформації відповідно до Закону України “Про доступ до публічної інформації”?","answers":["інформація, доступ до якої обмежується відповідно до Закону, розголошення якої може завдати шкоди особі, суспільству і державі;","інформація, доступ до якої обмежується наказами Служби безпеки України, розголошення якої може завдати шкоди особі, суспільству і державі;","інформація, доступ до якої обмежується органами державної влади, розголошення якої може завдати шкоди особі, суспільству і державі;","інформація, доступ до якої обмежено фізичною або юридичною особою, розголошення якої може завдати шкоди особі, суспільству і державі."],"correct":0}]},{"name":"Закон України «Про звернення громадян»","questions":[{"num":1,"q":"Яку особливу форму колективного звернення громадян до Президента України, Верховної Ради України, Кабінету Міністрів України, органу місцевого самоврядування визначено Законом України «Про звернення громадян»?","answers":["подання;","позовна заява;","електронна петиція;","протест."],"correct":2},{"num":2,"q":"Якими є наслідки оформлення звернення без дотримання вимог Закону України «Про звернення громадян»?","answers":["надання строку для належного оформлення такого звернення;","повернення звернення заявнику з відповідними роз'ясненнями;","залишення звернення без розгляду;","направлення звернення вищестоящому органу щодо можливості його розгляду."],"correct":1},{"num":3,"q":"Які звернення НЕ підлягають розгляду та вирішенню згідно із Законом України «Про звернення громадян»?","answers":["індивідуальні;","анонімні;","колективні;","усні."],"correct":1},{"num":4,"q":"Протягом якого строку належить повернути заявнику звернення, оформлене без дотримання вимог Закону України «Про звернення громадян»?","answers":["не пізніше як через 10 днів від дня його надходження;","негайно;","не пізніше як через 20 днів від дня його надходження;","не пізніше як через 15 днів від дня його надходження."],"correct":0},{"num":5,"q":"Як, Закон України «Про звернення громадян» вимагає діяти щодо звернень з питань, що НЕ входять до повноважень органу державної влади, органу місцевого самоврядування, підприємства, установи, організації, об'єднання громадян або посадової особи?","answers":["розглядати по суті;","пересилати за належністю;","залишати без розгляду;","повертати заявнику."],"correct":1},{"num":6,"q":"Чи стягується плата із заявників за розгляд звернень, відповідно до вимог Закону України «Про звернення громадян»?","answers":["стягується за розгляд звернень керівників юридичних осіб;","стягується у виняткових випадках;","плата не стягується;","стягується в будь-якому випадку."],"correct":2},{"num":7,"q":"Ким розглядаються звернення Героїв Радянського Союзу, Героїв Соціалістичної Праці, інвалідів Великої Вітчизняної війни згідно із Законом України «Про звернення громадян»?","answers":["першими керівниками;","заступниками керівників;","першими заступниками керівників;","співробітниками."],"correct":0},{"num":8,"q":"Які права НЕ має громадянин при розгляді заяви чи скарги, відповідно до Закону України «Про звернення громадян»?","answers":["бути присутнім при розгляді заяви чи скарги;","здійснювати окремі перевірочні дії;","знайомитися з матеріалами перевірки;","подавати додаткові матеріали або наполягати на їх запиті."],"correct":1},{"num":9,"q":"Який загальний термін вирішення питань, порушених у зверненні, НЕ можна перевищувати відповідно до вимог Закону України «Про звернення громадян»?","answers":["20 днів;","15 днів;","30 днів;","45 днів."],"correct":3},{"num":10,"q":"На підставі чого, відповідно до Закону України «Про звернення громадян» витрати, зроблені у зв'язку з перевіркою звернень, які містять завідомо неправдиві відомості, можуть бути стягнуті з громадянина?","answers":["на підставі рішення суду;","на підставі експертного висновку;","на підставі рішення керівника вищестоящого органу;","Законом не передбачено таких підстав."],"correct":0},{"num":11,"q":"В який спосіб відповідно до Закону України «Про звернення громадян» громадянин звертається до Президента України з електронною петицією?","answers":["прізвище, ім'я, по батькові автора (ініціатора) електронної петиції;","місце роботи автора (ініціатора) електронної петиції;","поштову адресу автора (ініціатора) електронної петиції;","документ про сплату збору за розгляд електронної петиції."],"correct":0},{"num":12,"q":"Чи підлягає розгляду письмове звернення без зазначення місця проживання, не підписане автором (авторами), а також таке, з якого неможливо встановити авторство?","answers":["підлягає","не підлягає","підлягає, але розгляд не обмежується в строках","підлягає розгляду після встановлення особи автора протягом 30 календарних днів"],"correct":1},{"num":13,"q":"Чи має право громадянин, який звернувся із заявою чи скаргою бути присутнім при розгляді його заяви чи скарги?","answers":["так, має таке право","так, але в присутності працівників поліції","ні, не має такого права","ні, крім громадян які мають пільги"],"correct":0},{"num":14,"q":"Чи може бути поновлений термін подання скарги громадянином який був пропущений з поважної причини?","answers":["може бути поновлений органом чи посадовою особою, що розглядає скаргу","може бути поновлений керівником посадової особи органу, що розглядає скаргу","не може бути поновлений","може бути поновлений Уповноваженим Верховної Ради України з прав людини."],"correct":0}]},{"name":"Закон України «Про Бюро економічної безпеки України»","questions":[{"num":1,"q":"Як визначається Бюро економічної безпеки України, відповідно до Закону України «Про Бюро економічної безпеки»?","answers":["державний правоохоронний орган, на який покладаються завдання щодо запобігання, виявлення, припинення, розкриття та розслідування злочинів, віднесених до його компетенції;","центральний орган виконавчої влади, на який покладаються завдання щодо протидії правопорушенням, що посягають на функціонування економіки держави;","центральний орган виконавчої влади, на який покладаються завдання щодо протидії правопорушенням під час застосування податкового та митного законодавства, запобігання та протидії легалізації (відмиванню) доходів, одержаних злочинним шляхом;","центральний орган виконавчої влади, який служить суспільству шляхом забезпечення охорони прав і свобод людини, протидії злочинності, підтримання публічної безпеки і порядку."],"correct":1},{"num":2,"q":"Як в Законі України «Про Бюро економічної безпеки України» визначено поняття «аналіз ризиків»?","answers":["це аналітична діяльність що передбачає дослідження економічної злочинності;","це інформаційно-аналітична діяльність щодо оцінки загроз економічній безпеці, ступеня її вразливості та рівня негативного впливу на неї;","це інформаційно-аналітична діяльність, спрямована на встановлення взаємозв'язків між даними про злочинну діяльність та іншими даними;","це діяльність інформаційних підрозділів Бюро економічної безпеки України з дослідження та аналізу стану економіки в державі."],"correct":1},{"num":3,"q":"Як в Законі України «Про Бюро економічної безпеки України» визначено поняття кримінальний аналіз?","answers":["це інформаційно-аналітична діяльність, спрямована на встановлення взаємозв'язків між даними про злочинну діяльність та іншими даними, потенційно з ними пов'язаними, їх оцінювання та інтерпретацію, прогнозування розвитку досліджуваних подій з метою їх використання для виявлення, припинення та розслідування кримінальних правопорушень, що посягають на функціонування економіки держави;","інформаційно-аналітична діяльність, спрямована на встановлення взаємозв'язків між даними про злочинну діяльність та іншими даними, що перебувають в розпорядженні правоохоронних органів;","аналітична діяльність, спрямована на припинення кримінальних правопорушень та допомогу в розслідуванні, що посягають на функціонування економіки держави та допомогу в їх розслідуванні;","інформаційно-аналітична діяльність щодо оцінки загроз економічній безпеці, ступеня її вразливості та рівня негативного впливу на неї."],"correct":0},{"num":4,"q":"Як визначається поняття «ризик» у Законі України «Про Бюро економічної безпеки України»?","answers":["порушення, що ідентифікується в економічній діяльності підприємств та організацій, вплив якої призводить до послаблення економіки держави;","загроза, що ідентифікується в бюджетній, податковій, митній, грошово-кредитній або інвестиційній сфері, вплив якої призводить до тінізації економіки та послаблення економічної безпеки держави;","загроза, що ідентифікується в податковій сфері, вплив якої призводить до зменшення надходжень в державний бюджет;","виявлена за результатами проведеного кримінального аналізу інформаційно-аналітичним підрозділом Бюро економічної безпеки України, загроза економіці держави."],"correct":1},{"num":5,"q":"Як в Законі України «Про Бюро економічної безпеки України» визначено поняття «управління ризиками»?","answers":["це виявлення, оцінювання та визначення ризиків вчинення кримінальних правопорушень у сфері економіки, а також вжиття відповідних заходів щодо управління ризиками у спосіб та в обсязі, що забезпечують мінімізацію таких ризиків залежно від їх рівня;","це аналітична діяльність щодо оцінки економічної злочинності в державі;","це аналітична діяльність щодо загроз економіці, ступеня її вразливості та рівня негативного впливу на неї;","це розроблення на основі оцінювання ризиків та реалізація управлінських рішень, спрямованих на мінімізацію таких ризиків, а також на підвищення спроможності державних інституцій щодо нейтралізації загроз економічній безпеці."],"correct":3},{"num":6,"q":"Яке правило щодо втручання Президента України у діяльність Бюро економічної безпеки України з підстав, не передбачених законом, встановлює Закон України «Про Бюро економічної безпеки України»?","answers":["допускається без додаткових застережень;","допускається лише в інтересах національної безпеки, захисту суверенітету і територіальної цілісності України;","допускається лише в ситуації крайньої необхідності та в умовах дії в Україні правового режиму воєнного стану;","забороняється."],"correct":3},{"num":7,"q":"Як визначається детектив Бюро економічної безпеки України відповідно до Закону України «Про Бюро економічної безпеки України»?","answers":["службова особа Бюро економічної безпеки України, уповноважена в межах компетенції, визначеної Законом України «Про оперативно-розшукову діяльність» та Кримінальним процесуальним кодексом України, здійснювати оперативно-розшукову діяльність і досудове розслідування кримінальних правопорушень, віднесених законом до підслідності Бюро економічної безпеки України;","державний службовець Бюро економічної безпеки України, уповноважений в межах компетенції, визначеної Законом України «Про Бюро економічної безпеки України» здійснювати досудове розслідування кримінальних правопорушень;","спеціальний працівник Бюро економічної безпеки України, призначений на посаду в підрозділ детективів за результатами конкурсного відбору, та уповноважена відповідно до чинного законодавства, здійснювати оперативно-розшукову діяльність і досудове розслідування;","службовець Бюро економічної безпеки України, який має спеціальне звання, та уповноважений в межах компетенції, визначеної Законом України «Про Бюро економічної безпеки України» здійснювати досудове розслідування кримінальних правопорушень, віднесених законом до підслідності Бюро економічної безпеки України."],"correct":0},{"num":8,"q":"Як Закон України «Про Бюро економічної безпеки України» визначає поняття «аналітик Бюро економічної безпеки України»?","answers":["державний службовець Бюро економічної безпеки України, основним завданням якої є проведення аналітичних досліджень кримінальних правопорушень, віднесених законом до підслідності Бюро економічної безпеки України та складання за результатами їх проведення довідок, у сфері інформаційно-аналітичної діяльності;","спеціально уповноважений на здійснення кримінального аналізу детектив Бюро економічної безпеки України;","службова особа Бюро економічної безпеки України, основним завданням якого є виконання завдань та функцій покладених на Бюро економічної безпеки України;","особа, яка має спеціальне звання Бюро економічної безпеки України, основним завданням якої є здійснення кримінального аналізу з метою виконання завдань Бюро економічної безпеки України."],"correct":3},{"num":9,"q":"Як відповідно до Закону України «Про Бюро економічної безпеки України» повинен діяти детектив Бюро економічної безпеки України у разі отримання вказівки з питань досудового розслідування в конкретному кримінальному провадженні, яка не передбачена Кримінальним процесуальним кодексом України?","answers":["не виконувати таку вказівку та невідкладно інформувати про це в письмовій формі правоохоронні органи;","не виконувати вказівку та невідкладно інформувати про це в письмовій формі Директора Бюро економічної безпеки України;","не виконувати вказівку до її письмового погодження з Директором Бюро економічної безпеки України;","не виконувати таку вказівку та письмово повідомити про це свого безпосереднього керівника."],"correct":0},{"num":10,"q":"Що із зазначеного є одним із завдань Бюро економічної безпеки України?","answers":["здійснення відповідно до закону оперативно-розшукової діяльності та досудового розслідування кримінальних правопорушень у сфері господарської діяльності та пов'язаних з ними кримінальних правопорушень;","пошук і фіксація, в межах своєї компетенції, фактичних даних про протиправні діяння службових осіб, відповідальність за які передбачена Кримінальним кодексом України;","здійснення превенції кримінальних правопорушень, які посягають на основи економічної системи держави;","виявлення та розслідування правопорушень, пов'язаних з отриманням та використанням міжнародної технічної допомоги."],"correct":3},{"num":11,"q":"Що із зазначеного є одним із завдань Бюро економічної безпеки України?","answers":["виявлення зон ризиків у сфері економіки шляхом аналізу структурованих і неструктурованих даних;","створення сприятливих умов для розвитку зовнішньоекономічної діяльності та захисту економічної конкуренції;","виявлення кримінальних правопорушень у сфері митної та податкової справи та забезпечення невідворотності кримінальної відповідальності за їх вчинення;","аналіз та управління ризиками та системними загрозами економічній безпеці держави."],"correct":0},{"num":12,"q":"Що із зазначеного є одним із завдань Бюро економічної безпеки України?","answers":["підтримання економічної безпеки громадян шляхом запобігання та припинення кримінальних правопорушень;","забезпечення економічної безпеки держави шляхом запобігання, виявлення, припинення, розслідування кримінальних правопорушень, що посягають на функціонування економіки держави;","виявлення та розслідування правопорушень, пов'язаних з отриманням неправомірної вигоди вчинених у сфері господарської діяльності;","забезпечення економічного росту держави шляхом виявлення, розслідування та аналізу кримінальних правопорушень, що посягають на функціонування економіки держави."],"correct":1},{"num":13,"q":"Що із зазначеного належить до повноважень Бюро економічної безпеки України відповідно до покладених на нього завдань?","answers":["здійснює моніторинг та контроль за виконанням актів законодавства з питань протидії корупційні злочинності;","формує та реалізує державну політику у сфері протидії злочинам, що посягають на економіку держави, розробляє проекти нормативно-правових актів з цих питань;","організовує проведення міжгалузевих досліджень з питань вивчення ситуації щодо злочинності у сфері економіки;","збирає, обробляє та аналізує інформацію щодо кримінальних правопорушень, віднесених законом до його підслідності."],"correct":3},{"num":14,"q":"Що із зазначеного належить до повноважень Бюро економічної безпеки України відповідно до покладених на нього завдань?","answers":["здійснює превентивні та профілактичні заходи під час проведення оперативно-розшукової діяльності та слідчих (розшукових) дій щодо економічних злочинів;","здійснює інформаційно-пошукову та аналітично-інформаційну роботу з метою виявлення та усунення причин і умов, що сприяють вчиненню кримінальних правопорушень, віднесених до підслідності Бюро економічної безпеки України;","здійснює інформаційно-аналітичні заходи щодо встановлення системних причин та умов проявів організованої злочинності та інших видів злочинності, вживає заходів до їх усунення;","формує політику протидії злочинності у сфері економіки."],"correct":1},{"num":15,"q":"Що із зазначеного належить до повноважень Бюро економічної безпеки України відповідно до покладених на нього завдань?","answers":["здійснює оперативне супроводження судового розгляду кримінальних проваджень, віднесених до його підслідності;","координує діяльність інших правоохоронних органів щодо виявлення та припинення злочинів, що посягають на економіку держави;","здійснює оперативно-розшукову діяльність та досудове розслідування у межах передбаченої законом підслідності;","забезпечує формування політики держави щодо протидії злочинності у сфері економіки."],"correct":2},{"num":16,"q":"Що із зазначеного належить до повноважень Бюро економічної безпеки України відповідно до покладених на нього завдань?","answers":["проведення оперативно-розшукових заходів для повернення в Україну з-за кордону активів, одержаних незаконним шляхом;","забезпечення конфіскації майна, одержаного внаслідок вчинення економічних злочинів, у порядку, передбаченому законодавством;","використання гласних і негласних штатних та позаштатних працівників на підставах та в порядку, встановлених законом, дотримуючись умов добровільності і конфіденційності таких відносин, матеріальне і моральне заохочує осіб, які надають допомогу в запобіганні, виявленні, припиненні і розслідуванні кримінальних правопорушень, віднесених до підслідності Бюро економічної безпеки України;","координація діяльності правоохоронних органів та інших державних органів і осіб, які сприяють оперативно-розшуковій діяльності та негласним слідчим (розшуковим) діям у сфері економічної злочинності."],"correct":2},{"num":17,"q":"Що із зазначеного належить до повноважень Бюро економічної безпеки України у сфері інформаційно-аналітичного забезпечення, відповідно до покладених на нього завдань?","answers":["отримує, обробляє та користується інформацією з автоматизованих інформаційних і довідкових систем, реєстрів, банків (баз) даних органів державної влади, органів місцевого самоврядування;","контролює функціонування автоматизованих інформаційних і довідкових систем, реєстрів, банків (баз) даних органів державної влади, органів місцевого самоврядування, повноту і правильність розміщених в них даних;","формує реєстри та бази (банки) даних, що входять до єдиної інформаційної системи Міністерства внутрішніх справ України;","формує єдину систему інформаційно-аналітичного забезпечення розшуку осіб, які переховуються від органів досудового розслідування, слідчого судді, суду або ухиляються від відбування кримінального покарання за вчинення кримінальних правопорушень, віднесених законом до його підслідності."],"correct":0},{"num":18,"q":"Що здійснюється при застосуванні ризик-орієнтованого підходу в Бюро економічної безпеки України?","answers":["оцінювання, повторне оцінювання ризиків, періодична фіксація результатів його застосування, підтримка в актуальному стані інформації щодо оцінки ризиків;","оцінювання ризиків та підтримка в актуальному стані звітів;","оцінювання ризиків та фіксація результатів у інформаційних висновках;","повторне оцінювання ризиків, періодична фіксація результатів його застосування та передання інформації щодо оцінки ризиків контролюючим органам та іншим органам державної влади."],"correct":0},{"num":19,"q":"Що включає комплекс заходів з оцінювання ризиків у сфері економіки згідно із Законом України «Про Бюро економічної безпеки України»?","answers":["лише збирання та аналіз інформації щодо результатів діяльності Бюро економічної безпеки України з метою забезпечення зниження злочинності, що посягає на функціонування економіки держави;","лише збирання, обробку, оцінювання та аналіз інформації щодо результатів діяльності Бюро економічної безпеки України;","виявлення, оцінювання та визначення ризиків вчинення кримінальних правопорушень у сфері економіки, а також вжиття відповідних заходів щодо управління ризиками у спосіб та в обсязі, що забезпечують мінімізацію таких ризиків залежно від їх рівня;","збирання, обробку, оцінювання та аналіз інформації щодо результатів діяльності Бюро економічної безпеки України, контролюючих органів та державних органів, що провадять діяльність у сфері протидії кримінальним правопорушенням та запобігання загрозам економічній безпеці держави, а також затвердження за результатами такого аналізу відповідних заходів для мінімізації та усунення ризиків у сфері економіки."],"correct":3},{"num":20,"q":"Як часто проводиться комплекс заходів з оцінювання ризиків у сфері економіки, відповідно до Закону України «Про Бюро економічної безпеки України»?","answers":["не рідше одного разу на три роки;","не рідше одного разу на п'ять років;","щорічно;","щоквартально."],"correct":0},{"num":21,"q":"Хто відповідно до Закону України «Про Бюро економічної безпеки України» створює аналітичні продукти?","answers":["лише аналітик Бюро економічної безпеки України;","лише аналітик або детектив Бюро економічної безпеки України;","лише детектив Бюро економічної безпеки України;","будь-який працівник Бюро економічної безпеки України, який має спеціальне звання."],"correct":0},{"num":22,"q":"Хто визначає строки створення аналітичних продуктів підрозділами Бюро економічної безпеки України?","answers":["орган державної влади, на запит якого створюється аналітичний продукт;","Офіс Генерального прокурора;","Міністерство фінансів України;","Бюро економічної безпеки України."],"correct":3},{"num":23,"q":"Що таке аналітичний продукт?","answers":["це результат аналітичного дослідження, складений у письмовій формі, з використанням інформації, що міститься в інформаційних системах Бюро економічної безпеки України та інших джерелах, у тому числі інформації, що міститься в заявах або повідомленнях про вчинення кримінального правопорушення;","це форма представлення даних та/або інформації у вигляді повнотекстових баз даних, яка складена за результатами аналітичної діяльності та дає можливість здійснювати швидкий пошук інформації;","це письмовий звіт за результатами аналітичного дослідження, в якому ідентифіковані ризики в бюджетній, податковій, митній, грошово-кредитній або інвестиційній сфері, вплив яких призводить до тінізації економіки та послаблення економічної безпеки держави;","правильна відповідь відсутня."],"correct":0},{"num":24,"q":"Що, відповідно до Закону України «Про Бюро економічної безпеки України», повинен містити аналітичний продукт?","answers":["звіт про методологію та результати проведених досліджень та зроблені за їх результатами пропозиції щодо удосконалення законодавства та практики його застосування;","результати всебічного, повного і неупередженого дослідження всіх ризиків у сфері економіки, а також опис вивчених матеріалів кримінальних проваджень та оперативно-розшукової діяльності;","обґрунтування встановлених взаємозв'язків між даними про злочинну діяльність та іншими даними, потенційно з ними пов'язаними, результати їх оцінювання та інтерпретації;","опис проведених досліджень та зроблених за їх результатами висновків, відповідей на запитання, поставлені замовником аналізу, або на запитання, поставлені за власною ініціативою під час аналізу наявної інформації."],"correct":3},{"num":25,"q":"Які із названих підрозділів згідно Закону України «Про Бюро економічної безпеки України», може включати структура Бюро економічної безпеки України?","answers":["технічні підрозділи та підрозділи детективів;","підрозділи детективів, інформаційно-аналітичні, оперативно-технічні та інші підрозділи;","слідчі та оперативні підрозділи, підрозділи внутрішнього аудиту та інші підрозділи;","підрозділи досудового розслідування, підрозділи оперативно-диспетчерської служби та спеціального призначення."],"correct":1},{"num":26,"q":"Хто із названих суб’єктів затверджує структуру та штатний розпис Бюро економічної безпеки України?","answers":["Президент України;","Кабінет Міністрів України;","Прем'єр-міністр України;","Директор Бюро економічної безпеки України."],"correct":3},{"num":27,"q":"Якою є гранична чисельність працівників центрального апарату і територіальних управлінь Бюро економічної безпеки України?","answers":["1 тисяча осіб;","2 тисячі осіб;","3 тисячі осіб;","4 тисячі осіб."],"correct":3},{"num":28,"q":"Ким утворюються, реорганізовуються та ліквідовуються територіальні управління Бюро економічної безпеки України?","answers":["Верховною Радою України;","Кабінетом Міністрів України;","Президентом України;","Директором Бюро економічної безпеки України."],"correct":1},{"num":29,"q":"Ким і в якому порядку призначається на посаду Директор Бюро економічної безпеки України?","answers":["Президентом України за поданням Прем'єр-міністра України;","Прем'єр-міністром України відповідно до подання кадрової комі
