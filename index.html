<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>БЕБ Тренажер — 467 питань</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1117;--sur:#1a1d27;--sur2:#232636;--brd:#2e3247;
  --acc:#4f8ef7;--acc2:#7c6af7;--grn:#22c55e;--red:#ef4444;
  --org:#f59e0b;--txt:#e8eaf0;--txt2:#8b90a7;--txt3:#5a5f7a;--r:14px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}
/* HOME */
.hdr{background:linear-gradient(160deg,#1e2236 0%,#131620 100%);padding:36px 20px 24px;border-bottom:1px solid var(--brd);text-align:center}
.badge{display:inline-flex;align-items:center;gap:5px;background:rgba(79,142,247,.12);border:1px solid rgba(79,142,247,.28);color:var(--acc);padding:4px 14px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
.htitle{font-family:'Montserrat',sans-serif;font-size:24px;font-weight:800;background:linear-gradient(130deg,#fff 30%,var(--acc));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:5px}
.hsub{color:var(--txt2);font-size:12px}
.hstats{display:flex;justify-content:center;gap:24px;margin-top:18px}
.hst{text-align:center}.hst-n{font-family:'Montserrat',sans-serif;font-size:24px;font-weight:800;color:var(--acc)}.hst-l{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.6px}
.oprog{padding:12px 16px 0}
.oprog-row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px}
.oprog-lbl{color:var(--txt2)}.oprog-pct{color:var(--acc);font-weight:700}
.oprog-bar{height:4px;background:var(--brd);border-radius:2px}
.oprog-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:2px;transition:.4s}
.slist{padding:10px 16px 28px;flex:1}
.scard{display:flex;align-items:center;gap:12px;background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);padding:13px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,transform .15s;user-select:none}
.scard:hover{border-color:var(--acc);transform:translateY(-1px)}.scard:active{transform:scale(.98)}
.sc-ico{font-size:24px;flex-shrink:0}.sc-inf{flex:1;min-width:0}
.sc-name{font-weight:600;font-size:13px;line-height:1.3;margin-bottom:3px}
.sc-meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt2)}
.sc-cnt{background:rgba(79,142,247,.14);color:var(--acc);padding:2px 7px;border-radius:12px;font-weight:700;font-size:10px}
.sc-pbar{height:3px;background:var(--brd);border-radius:2px;margin-top:7px}
.sc-pfill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:2px;transition:.3s}
.sc-rt{display:flex;align-items:center;gap:6px;flex-shrink:0}
.sc-dot{width:7px;height:7px;border-radius:50%}.sc-dot.done{background:var(--grn)}.sc-dot.part{background:var(--org)}.sc-dot.none{background:var(--brd)}
/* QUIZ */
.qhdr{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--sur);border-bottom:1px solid var(--brd);position:sticky;top:0;z-index:10}
.btn-back{background:none;border:none;color:var(--txt2);font-size:22px;cursor:pointer;padding:2px 4px;line-height:1;flex-shrink:0}
.qhdr-name{font-size:11px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt2)}
.qcnts{display:flex;gap:5px;flex-shrink:0}
.qcnt{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700}
.qcnt.r{background:rgba(79,142,247,.14);color:var(--acc)}.qcnt.c{background:rgba(34,197,94,.14);color:var(--grn)}.qcnt.w{background:rgba(239,68,68,.14);color:var(--red)}
.qtmr{font-size:11px;color:var(--txt3);min-width:26px;text-align:right;flex-shrink:0}
.qnav{display:flex;gap:3px;padding:8px 14px 0;overflow-x:auto;scrollbar-width:none}
.qnav::-webkit-scrollbar{display:none}
.qnd{min-width:28px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;border:1px solid var(--brd);background:var(--sur2);color:var(--txt3);transition:.1s;flex-shrink:0}
.qnd.cur{background:var(--acc);color:#fff;border-color:var(--acc)}.qnd.ok{background:rgba(34,197,94,.18);border-color:var(--grn);color:var(--grn)}.qnd.err{background:rgba(239,68,68,.18);border-color:var(--red);color:var(--red)}
.qbody{padding:14px 16px;flex:1}
.qlbl{display:flex;justify-content:space-between;font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.qtxt{font-size:16px;font-weight:600;line-height:1.45;margin-bottom:18px}
.alist{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.abtn{background:var(--sur2);border:1.5px solid var(--brd);border-radius:var(--r);padding:12px 14px;text-align:left;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;color:var(--txt);transition:all .12s;width:100%;line-height:1.4;display:flex;align-items:center;gap:10px}
.abtn:hover:not(:disabled){border-color:var(--acc);background:rgba(79,142,247,.07)}.abtn:active:not(:disabled){transform:scale(.98)}
.abtn.ok{border-color:var(--grn)!important;background:rgba(34,197,94,.1)!important;color:var(--grn)!important}
.abtn.bad{border-color:var(--red)!important;background:rgba(239,68,68,.1)!important;color:var(--red)!important}
.abtn:disabled{cursor:default}
.altr{width:23px;height:23px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;background:var(--brd);color:var(--txt2);transition:.12s}
.abtn.ok .altr{background:var(--grn);color:#fff}.abtn.bad .altr{background:var(--red);color:#fff}
.qrbox{border-radius:var(--r);padding:13px;margin-bottom:13px;display:none}
.qrbox.show{display:block}.qrbox.okb{background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.2)}.qrbox.badb{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2)}
.qrt{font-weight:700;font-size:14px;margin-bottom:5px}.qrt.ok{color:var(--grn)}.qrt.bad{color:var(--red)}
.qrexp{font-size:12px;color:var(--txt2);line-height:1.6;margin-top:4px}
.qrload{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt3)}
.spin{width:13px;height:13px;border:2px solid var(--brd);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.qacts{display:flex;gap:8px;padding:0 16px 24px;flex-shrink:0}
.btn-nxt{flex:1;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:none;border-radius:var(--r);padding:14px;font-family:'Inter',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:.12s}
.btn-nxt:active{transform:scale(.97)}.btn-nxt:disabled{opacity:.3;cursor:default}
.btn-und{background:var(--sur2);border:1.5px solid var(--brd);color:var(--txt);border-radius:var(--r);padding:14px 18px;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-und:hover{border-color:var(--acc);color:var(--acc)}
/* RESULTS */
#results{align-items:center;justify-content:center;padding:20px}
.rcard{background:var(--sur);border:1px solid var(--brd);border-radius:20px;padding:28px 20px;max-width:360px;width:100%;text-align:center}
.rt{font-family:'Montserrat',sans-serif;font-size:19px;font-weight:800;margin-bottom:3px}
.rsub{font-size:12px;color:var(--txt2);margin-bottom:22px;line-height:1.4}
.rscore{font-family:'Montserrat',sans-serif;font-size:52px;font-weight:800;line-height:1;margin-bottom:3px;background:linear-gradient(135deg,var(--grn),var(--acc));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.rscore.bad{background:linear-gradient(135deg,var(--red),var(--org));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.rfrac{font-size:14px;color:var(--txt2);margin-bottom:5px}.rtime{font-size:11px;color:var(--txt3);margin-bottom:22px}
.rrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--brd);font-size:13px}.rrow:last-of-type{border:none}
.rl{color:var(--txt2)}.rv{font-weight:700}
.racts{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.bp{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:none;border-radius:var(--r);padding:13px;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;cursor:pointer;width:100%}
.bs{background:var(--sur2);border:1.5px solid var(--brd);color:var(--txt);border-radius:var(--r);padding:12px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;width:100%}
.bs:hover{border-color:var(--acc);color:var(--acc)}
.be{background:rgba(239,68,68,.1);border:1.5px solid rgba(239,68,68,.25);color:var(--red);border-radius:var(--r);padding:12px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;width:100%}
.be:hover{background:rgba(239,68,68,.18)}.be:disabled{opacity:.3;cursor:default}
</style>
</head>
<body>

<div class="screen active" id="home">
  <div class="hdr">
    <div class="badge">🎯 БЕБ Тренажер 2026</div>
    <div class="htitle">Тести для держслужбовців</div>
    <div class="hsub">Категорії Б/В · Рядові посади БЕБ · 467 питань</div>
    <div class="hstats">
      <div class="hst"><div class="hst-n">467</div><div class="hst-l">Питань</div></div>
      <div class="hst"><div class="hst-n">8</div><div class="hst-l">Розділів</div></div>
      <div class="hst"><div class="hst-n" id="hs-done">0</div><div class="hst-l">Пройдено</div></div>
    </div>
  </div>
  <div style="text-align:center;padding:8px 16px 0">
    <button onclick="resetProgress()" style="background:none;border:1px solid var(--brd);color:var(--txt3);border-radius:8px;padding:5px 14px;font-size:11px;cursor:pointer;font-family:'Inter',sans-serif" onmouseover="this.style.borderColor='var(--red)';this.style.color='var(--red)'" onmouseout="this.style.borderColor='var(--brd)';this.style.color='var(--txt3)'">🗑 Скинути прогрес</button>
  </div>
  <div class="oprog">
    <div class="oprog-row"><span class="oprog-lbl">Загальний прогрес</span><span class="oprog-pct" id="op-pct">0%</span></div>
    <div class="oprog-bar"><div class="oprog-fill" id="op-fill" style="width:0%"></div></div>
  </div>
  <div class="slist" id="slist"></div>
</div>

<div class="screen" id="quiz">
  <div class="qhdr">
    <button class="btn-back" id="btn-back">←</button>
    <div class="qhdr-name" id="qhdr-name"></div>
    <div class="qcnts">
      <div class="qcnt r" id="cnt-r">0</div>
      <div class="qcnt c" id="cnt-c">0</div>
      <div class="qcnt w" id="cnt-w">0</div>
    </div>
    <div class="qtmr" id="qtmr">0с</div>
  </div>
  <div class="qnav" id="qnav"></div>
  <div class="qbody">
    <div class="qlbl"><span id="qlbl-n">Питання 1</span><span id="qlbl-s"></span></div>
    <div class="qtxt" id="qtxt"></div>
    <div class="alist" id="alist"></div>
    <div class="qrbox" id="qrbox">
      <div class="qrt" id="qrt"></div>
      <div id="qrexp"></div>
    </div>
  </div>
  <div class="qacts">
    <button class="btn-und" id="btn-und" style="display:none">✓ Зрозуміло</button>
    <button class="btn-nxt" id="btn-nxt" disabled>Відповісти →</button>
  </div>
</div>

<div class="screen" id="results">
  <div class="rcard">
    <div class="rt">Результат</div>
    <div class="rsub" id="rs-sub"></div>
    <div class="rscore" id="rs-score"></div>
    <div class="rfrac" id="rs-frac"></div>
    <div class="rtime" id="rs-time"></div>
    <div class="rrow"><span class="rl">✅ Правильно</span><span class="rv" id="rs-ok" style="color:var(--grn)"></span></div>
    <div class="rrow"><span class="rl">❌ Помилки</span><span class="rv" id="rs-bad" style="color:var(--red)"></span></div>
    <div class="rrow"><span class="rl">📊 Результат</span><span class="rv" id="rs-pct"></span></div>
    <div class="racts">
      <button class="be" id="btn-rerr">⚠️ Повторити по помилках</button>
      <button class="bs" id="btn-ragn">🔄 Пройти ще раз</button>
      <button class="bp" id="btn-rhome">← На головну</button>
    </div>
  </div>
</div>

<script>

const D = [{"name":"Конституція України","questions":[{"num":1,"q":"Якою є форма державного устрою України?","answers":["Україна є конфедеративною державою;","Україна є федеративною державою;","Україна є унітарною державою;","Україна є суб’єктом федерації."],"correct":2},{"num":2,"q":"Хто є носієм суверенітету України?","answers":["Верховна Рада України;","народ;","Президент України;","територіальні громади."],"correct":1},{"num":3,"q":"Хто є єдиним джерелом влади в України?","answers":["Президент України;","Верховна Рада України;","Конституція України;","Народ."],"correct":3},{"num":4,"q":"Яка форма правління в Україні?","answers":["президентська республіка;","президентсько-парламентська республіка;","парламентсько-президентська республіка;","президентська (або парламентська) монархія."],"correct":2},{"num":5,"q":"Що є головним обов’язком держави відповідно до Конституції України?","answers":["Утвердження і забезпечення прав і свобод людини;","Інтеграція української держави в європейський правовий простір та вступ до Європейського Союзу;","Боротьба зі злочинністю і усіх її проявах та видах;","Побудова дійового та ефективного громадянського суспільства."],"correct":0},{"num":6,"q":"Кому належить право визначати і змінювати конституційний лад в Україні?","answers":["Виключно Конституційному Суду України;","Виключно народові;","Виключно Президентові України;","виключно Верховній Раді України."],"correct":1},{"num":7,"q":"Що із зазначеного належить до державних символів України?","answers":["Державний Прапор України, Державний Герб України, Президент України;","Державний Прапор України, Державний Герб України, Державний Гімн України;","Конституція України, Державний Прапор України, Державний Герб України, Державний Гімн України;","Державний Прапор України, Державний Герб України, Державний Гімн України, столиця України – місто-герой Київ."],"correct":1},{"num":8,"q":"Що відповідно до Конституції України визначається найвищою соціальною цінністю в Україні?","answers":["Людина, її життя і здоров’я, честь і гідність, недоторканність і безпека;","Влада Українського народу;","Українська держава, суспільна безпека та Конституція України;","Державний суверенітет та територіальна цілісність України."],"correct":0},{"num":9,"q":"Який рівень життя повинні забезпечити пенсії і інші види соціальних виплат та допомоги, що є основним джерелом існування, відповідно до Конституції України?","answers":["Не нижчий від мінімальної заробітної плати;","Не нижчий від середньої плати в України;","Не нижчий від прожиткового мінімуму, встановленого законом;","не нижчий від двох прожиткових мінімумів, встановлених законом."],"correct":2},{"num":10,"q":"Яким чином Конституція України регулює питання використання примусової праці?","answers":["Дозволяє у місцях позбавлення волі;","Відносить це питання до сфери компетенції Кабінету Міністрів України;","Не містить норм щодо використання примусової праці;","Забороняє."],"correct":3},{"num":11,"q":"Яким чином Конституція України регулює питання скорочення мережі державних і комунальних закладів охорони здоров’я?","answers":["існуюча мережа не може бути скорочена;","дане питання відноситься до компетенції Кабінету Міністрів України;","дане питання не регулюється Конституцією України;","скорочення не забороняється."],"correct":0},{"num":12,"q":"Які правові наслідки має незнання законів відповідно до Конституції України?","answers":["обтяжує юридичну відповідальність;","звільняє від юридичної відповідальності;","не звільняє від юридичної відповідальності;","полегшує юридичну відповідальність."],"correct":2},{"num":13,"q":"Якими нормативно-правовими актами України визначається порядок застосування мов в Україні?","answers":["Виключно законами України;","Рішеннями місцевих державних адміністрацій;","Указами Президента України;","Постановами Кабінету Міністрів України."],"correct":0},{"num":14,"q":"Які дії уповноважений вчиняти Президент України стосовно актів Кабінету Міністрів України?","answers":["Зупиняти їх дію з мотивів невідповідності законодавству України з одночасним зверненням до Верховного Суду щодо їх відповідності законодавству України;","Скасувати їх дію з мотивів невідповідності законодавству України з одночасним зверненням до Конституційного Суду України щодо їх конституційності;","Зупиняти їх дію з мотивів невідповідності Конституції України з одночасним зверненням до Конституційного Суду України щодо їх конституційності.","Скасувати їх дію з мотивів невідповідності законодавству України з одночасним зверненням до Вищого адміністративного суду України щодо їх відповідності законодавству України."],"correct":2},{"num":15,"q":"Якими нормативно-правовими актами вводяться в дію Рішення Ради національної безпеки і оборони України?","answers":["Указами Президента України;","Постановами Кабінету Міністрів України;","Постановами Верховної Ради України;","Розпорядженнями Президента України."],"correct":0},{"num":16,"q":"Який орган затверджує державний бюджет України?","answers":["Національний банк України;","Верховна Рада України;","Президент України;","Кабінет Міністрів України."],"correct":1},{"num":17,"q":"При якому органі державної влади або посадовій особі органу державної влади діє Рада національної безпеки і оборони України як координаційний орган з питань національної безпеки і оборони?","answers":["При Голові Верховної Ради України;","При Прем’єр міністрові України;","При Президентові України;","При Офісі Президента України."],"correct":2},{"num":18,"q":"Якими нормативно-правовими актами України визначаються правові засади і гарантії підприємництва; правила конкуренції та норми антимонопольного регулювання?","answers":["Рішеннями місцевих державних адміністрацій;","Постановами Кабінету Міністрів України;","Указами Президента України;","Виключно законами України."],"correct":3},{"num":19,"q":"Які нормативно-правові акти видає Президент України на основі та на виконання Конституції України і законів України?","answers":["Закони і постанови;","Накази і постанови;","Укази і розпорядження;","Накази і укази."],"correct":2},{"num":20,"q":"Ким і в якому порядку призначається на посаду Прем’єр-міністр України?","answers":["Президентом України за поданням Голови Верховної Ради України;","Президентом України за згоди Верховної Ради України.","Верховною Радою України за поданням Голови Верховної Ради України;","Верховною Радою України за поданням Президента України."],"correct":2},{"num":21,"q":"Які нормативно-правові акти видає Кабінет Міністрів України в межах своєї компетенції?","answers":["Постанови і накази;","Постанови і розпорядження;","Постанови і укази;","Декрети, укази і розпорядження."],"correct":1},{"num":22,"q":"Який орган, відповідно до Конституції України, здійснює процесуальне керівництво досудовим розслідуванням?","answers":["Уповноважений Верховної Ради України з прав людини;","Прокуратура України;","Міністерство юстиції України;","Міністерство внутрішніх справ України."],"correct":1},{"num":23,"q":"Чи можуть в Україні діяти спеціалізовані суди відповідно до Конституції України?","answers":["ні, не можуть, оскільки це прямо заборонене Законом України;","так, але відповідно до Закону можуть діяти лише вищі спеціалізовані суди;","ні, не можуть, оскільки це прямо заборонене Конституцією України;","так, Президентом України можуть бути створені будь-які спеціалізовані суди."],"correct":1},{"num":24,"q":"Чи існує у системі судоустрою України найвищий суд?","answers":["Так, це Верховний Суд;","Так, це Конституційний Суд України;","Ні, не існує, усі суди є рівними;","так, це Вищий спеціалізований суд України. ."],"correct":0},{"num":25,"q":"Яким нормативно-правовим актом, відповідно до Конституції України, визначаються особливості місцевого самоврядування з містах Києві і Севастополі?","answers":["Законом України;","Указом Президента України;","Зборами місцевої громади;","Актами Голови міської адміністрації."],"correct":0},{"num":26,"q":"Що є елементами системи адміністративно-територіального устрою України?","answers":["Територіальні громади, районні в містах, сільські і селищні ради;","Автономна Республіка Крим, області, райони, міста, райони в містах, селища і села;","Автономна Республіка Крим, обласні та районні ради, міста, об'єднані територіальні громади;","Верховна рада Автономної Республіки Крим, обласні, районні державні адміністрації."],"correct":1},{"num":27,"q":"Хто відповідно до Конституції України управляє майном, що перебуває у комунальній власності?","answers":["Місцеві державні адміністрації через утворені ними територіальні громади органів місцевого самоврядування;","Місцеві державні адміністрації села, селища, міста безпосередньо або через утворені ними органи місцевого самоврядування;","Територіальні громади села, селища, міста безпосередньо або через утворені ними органи місцевого самоврядування;","Особи, що перебувають на території села, селища, міста безпосередньо або через утворені ними органи місцевого самоврядування."],"correct":2},{"num":28,"q":"На засадах її поділу, на які складові здійснюється державна влада в Україні відповідно до Конституції України?","answers":["На законодавчу, контрольну, виконавчу та судову;","На законодавчу, виконавчу, прокурорську та судову;","На законодавчу, виконавчу та судову;","На законодавчу, виконавчу, президентську та судову."],"correct":2},{"num":29,"q":"Якими із зазначеного є норми Конституції України?","answers":["Нормами прямої дії;","Нормами загальної дії;","Нормами відсильної дії;","Нормами спеціальної дії."],"correct":0},{"num":30,"q":"Ким, відповідно до Конституції України, набувається і реалізується право власності на землю?","answers":["громадянами, юридичними особами та державою відповідно до законів України або підзаконних нормативних актів;","громадянами України, іноземцями, біженцями особами без громадянства, юридичними особами та державою відповідно до Закону;","громадянами, юридичними особами та державою відповідно до Закону, актів Кабінету Міністрів України та актів Президента України;","громадянами, юридичними особами та державою відповідно до Закону."],"correct":0},{"num":31,"q":"На кого відповідно до Конституції України покладаються оборона України, захист її суверенітету, територіальної цілісності та недоторканності?","answers":["Збройні Сили України;","державні органи сектору безпеки і оборони в межах їх повноважень;","Президента України як Верховного Головнокомандувача Збройних Сил України;","державні органи сектору безпеки і оборони в межах їх повноважень."],"correct":0},{"num":32,"q":"На кого, згідно з Конституцією України, покладається забезпечення державної безпеки і захист державного кордону України?","answers":["На відповідні військові формування та правоохоронні органи держави;","На спеціальні правоохоронні органи;","На військові формування прикордонних областей України;","На відповідні органи державної влади згідно з указами Президента України."],"correct":0},{"num":33,"q":"Чи допускається, згідно з Конституцією України, розташування іноземних військових баз на території України?","answers":["Забороняється окрім виключних випадків, передбачених Законом;","Допускається для проведення довгострокових спільних військових навчань з особовим складом Збройних Сил України;","Не допускається без будь-яких винятків;","Дозволяється указом Президента України за згодою Верховної Ради України."],"correct":2},{"num":34,"q":"Чи допускається, відповідно до Конституції України, скасування конституційних прав і свобод людини і громадянина?","answers":["ні, не допускається, оскільки Конституція України передбачає лише можливість їхнього обмеження;","так, допускається на період дії воєнного або надзвичайного стану;","так, допускається щодо осіб, які відбувають покарання у вигляді позбавлення волі;","ні, не допускається, за винятком випадків, прямо встановлених указом Президента України."],"correct":0},{"num":35,"q":"Хто призначає суддів Конституційного Суду України?","answers":["Спільно Президент України та Верховна Рада України;","Президент України, Верховна Рада України, Прем’єр-міністр України;","Президент України, Верховна Рада України, з’їзд суддів України;","Верховна Рада України, з’їзд суддів України, Кабінет Міністрів України."],"correct":1},{"num":36,"q":"Скільки суддів Конституційного Суду України призначає з’їзд суддів України?","answers":["Шість;","Вісім;","Десять;","Жодного."],"correct":0},{"num":37,"q":"В якому порядку набувається право приватної власності згідно з Конституцією України?","answers":["В порядку, визначеному Конституцією України;","В порядку, визначеному актами Президента України;","В порядку, визначеному Законом;","В порядку, визначеному актами Кабінету Міністрів України."],"correct":2},{"num":38,"q":"Хто призначає та звільняє з посади Голову Верховного Суду?","answers":["Вища кваліфікаційна комісія суддів України;","Верховна Рада України;","Президент України;","Пленум Верховного Суду."],"correct":3},{"num":39,"q":"Який характер, згідно з Конституцією України, має юридична відповідальність особи?","answers":["Преюдиційний характер;","Колективний характер;","Превентивний характер;","Індивідуальний характер."],"correct":3},{"num":40,"q":"До якого моменту особа вважається невинуватою у вчиненні злочину і не може бути піддана кримінальному покаранню?","answers":["Доки її вину не буде доведено в законному порядку і встановлено обвинувальним вироком суду;","Доки вона не використала всі засоби правового захисту;","Доки прокурор не виступить з обвинувальною промовою в суді;","Доки вона не оскаржила обвинувальний вирок суду в усіх судових інстанціях."],"correct":0},{"num":41,"q":"Якими мовами повинна володіти особа, яку призначають на посаду судді?","answers":["Державною мовою та однією із мов офіційного діловодства Європейського Суду з прав людини;","Державною мовою та мовою міжнародного судочинства;","Державною мовою;","Державною мовою та мовою національних меншин за місцезнаходженням суду."],"correct":2},{"num":42,"q":"Яким є конституційний підхід до використання припущень під час обвинувачення особи у вчиненні злочину?","answers":["припущення можуть використовуватися як допоміжний елемент обвинувачення за умови їх належного доказового підтвердження;","обвинувачення не може ґрунтуватися на припущеннях;","припущення можуть братися до уваги, якщо вони ґрунтуються на висновках експертів або інших спеціалістів;","припущення можуть використовуватися стороною обвинувачення для формування обвинувачення, але не можуть бути єдиною його підставою."],"correct":1},{"num":43,"q":"Які, згідно з Конституцією України, правові наслідки відмови особи давати показання або пояснення щодо себе, членів сім’ї чи близьких родичів?","answers":["Є підставою для притягнення такої особи до відповідальності;","Не є підставою для притягнення такої особи до відповідальності, окрім випадків розслідування тяжких та особливо тяжких злочинів;","Є підставою для притягнення такої особи до відповідальності та проведення негласних слідчих дій щодо членів її сім’ї чи близьких родичів;","Не є підставою для притягнення такої особи до відповідальності."],"correct":3},{"num":44,"q":"Ким, згідно з Конституцією України, вноситься подання Президенту України про призначення судді на посаду?","answers":["Вищою радою правосуддя;","З’їздом суддів України;","Громадськістю;","Державною судовою адміністрацією."],"correct":0},{"num":45,"q":"На кого відповідно до Конституції України покладається обов’язок захищати незалежність та територіальну цілісність України?","answers":["на держави-союзники України відповідно до міжнародних договорів;","на військовослужбовців, працівників правоохоронних органів та посадових осіб органів державної влади;","на громадян України;","на всіх осіб, які законно перебувають на території України."],"correct":2},{"num":46,"q":"На кого відповідно до Конституції України покладається обов’язок шанувати державні символи України?","answers":["на військовослужбовців і посадових осіб органів державної влади та органів місцевого самоврядування;","на громадян України;","на всіх осіб, які перебувають на території України;","на осіб, які на законних підставах перебувають на території України."],"correct":2},{"num":47,"q":"На підставі якого нормативного акта, відповідно до Конституції України, громадяни України відбувають військову службу?","answers":["Указу Президента України про введення воєнного стану;","Наказу Міністра оборони України;","Указу Президента України про проведення призову громадян на військову службу;","Закону України «Про військовий обов'язок і військову службу»."],"correct":3},{"num":48,"q":"Чи може бути обмежене, згідно з Конституцією України, вільне волевиявлення виборців під час виборів до органів державної влади та органів місцевого самоврядування?","answers":["Так, але лише під час позачергових виборів;","Так, але лише під час виборів в умовах надзвичайного чи воєнного стану;","Вільне волевиявлення не може бути обмежене;","Так, але лише Законом України."],"correct":2},{"num":49,"q":"Чи допускається референдум щодо законопроекту з питань амністії?","answers":["ні, якщо місця позбавлення волі не переповнені ув'язненими;","так, на вимогу не менш як трьох мільйонів громадян України, які мають право голосу;","ні, референдум щодо законопроектів з питань амністії не допускається;","так, у разі його проголошення Президентом України."],"correct":2},{"num":50,"q":"Які правові наслідки має набрання законної сили обвинувальним вироком суду щодо народного депутата України відповідно до Конституції та законодавства України?","answers":["виконання обвинувального вироку щодо народного депутата України відкладається до завершення строку його депутатських повноважень;","повноваження народного депутата України припиняються достроково у встановленому законом порядку;","набрання законної сили обвинувальним вироком не тягне жодних правових наслідків для статусу народного депутата України;","народний депутат України втрачає право бути обраним народним депутатом України на наступних виборах, але зберігає чинний мандат до завершення строку повноважень Верховної Ради України."],"correct":1},{"num":51,"q":"Якою, відповідно до Конституції України, є процедура оголошення стану війни?","answers":["Оголошує Президент України за поданням Ради національної безпеки і оборони України;","Оголошує Кабінет Міністрів України за поданням міністра оборони або Президент України;","Оголошує Верховна Рада України за поданням Президента України;","Оголошує Верховна Рада України за поданням не менш як 300 народних депутатів України."],"correct":2},{"num":52,"q":"Хто формує персональний склад Ради національної безпеки і оборони України?","answers":["Президент України;","Президент України за погодженням з Верховною Радою України;","Президент України за пропозицією Міністра оборони України;","Спільно Президент України, Верховна Рада України, Кабінет Міністрів України."],"correct":0},{"num":53,"q":"До чиїх повноважень належить затвердження загальної структури, чисельності, визначення функцій Служби безпеки України та Збройних Сил України?","answers":["Президента України;","Кабінету Міністрів України;","Верховної Ради України;","Народу України."],"correct":2},{"num":54,"q":"Хто може висловити недовіру Генеральному прокуророві, що має наслідком його відставку з посади?","answers":["Президент України;","Колегія Генеральної прокуратури України;","Конституційний Суд України;","Верховна Рада України."],"correct":3},{"num":55,"q":"На який період часу зберігається звання Президента України відповідно до Конституції України?","answers":["довічно, якщо Президент України не був усунений з поста в порядку імпічменту;","довічно, незалежно від підстав і способу припинення повноважень;","на строк виконання повноважень Президента України;","довічно, якщо повноваження Президента України не були припинені достроково."],"correct":0},{"num":56,"q":"Якими нормативно-правовими актами відповідно до Конституції України визначається територіальний устрій України?","answers":["Конституцією України та законами України;","законами України і підзаконними нормативно-правовими актами органів виконавчої влади;","Конституцією України, законами України та актами Президента України;","виключно Конституцією України."],"correct":0},{"num":57,"q":"Гарантом чого, відповідно до Конституції України, є Президент України?","answers":["державної безпеки, суверенітету, обороноздатності, територіальної цілісності України, додержання Конституції України;","узгодженого функціонування органів державної влади та виконання ними конституційних повноважень;","державного суверенітету, територіальної цілісності України, додержання Конституції України, прав і свобод людини і громадянина;","державного суверенітету, територіальної цілісності України, додержання Конституції України, законів України та міжнародних зобов'язань держави."],"correct":2},{"num":58,"q":"Яким актом оголошується амністія в Україні?","answers":["Законом України;","Указом Президента України;","Наказом Генерального прокурора;","Постановою Верховного Суду."],"correct":0},{"num":59,"q":"Ким є Президент України за Конституцією України?","answers":["Главою держави;","Лідером народу України;","Главою держави і виконавчої влади;","Державним символом України."],"correct":0},{"num":60,"q":"До чиєї компетенції за Конституцією України належить здійснення помилування?","answers":["Кабінету Міністрів України;","Верховного Суду;","Президента України;","Верховної Ради України."],"correct":2},{"num":61,"q":"Хто за Конституцією України здійснює контроль за використанням коштів Державного бюджету України?","answers":["Прокуратура України;","Верховна Рада України;","Національний банк України;","Рахункова палата."],"correct":3},{"num":62,"q":"Чи допускається, згідно з Конституцією України, делегування функцій судів іншим органам?","answers":["Так, за рішенням Президента України;","Так, у випадках, встановлених Верховною Радою України;","Ні, можливе делегування функцій лише Конституційному Суду України;","Ні, делегування функцій судів іншим органам не допускається."],"correct":3},{"num":63,"q":"Які органи, згідно з Конституцією України, здійснюють правосуддя в Україні?","answers":["Суди та міжнародні правозахисні організації у випадках, передбачених законом;","Суди та Рада суддів України;","Виключно суди;","Суди та органи прокуратури."],"correct":2},{"num":64,"q":"На які правовідносини поширюється юрисдикція судів відповідно до Конституції України?","answers":["на будь-який юридичний спір та будь-яке кримінальне обвинувачення;","на публічно-правові та приватно-правові відносини, сторони яких перебувають під юрисдикцією України;","виключно на правовідносини, безпосередньо передбачені Конституцією України;","виключно на правовідносини, врегульовані Конституцією України та законами України."],"correct":0},{"num":65,"q":"Протягом якого часу судді обіймають посади згідно з Конституцією України?","answers":["суддя обіймає посаду протягом п'яти років з правом перепризначення;","суддя обіймає посаду безстроково;","суддя обіймає посаду безстроково, крім суддів Верховного Суду;","суддя обіймає посаду безстроково, крім суддів, які призначаються на посаду судді вперше."],"correct":1},{"num":66,"q":"До відання якого органу, згідно з Конституцією України, належить прийняття рішення стосовно порушення суддями і прокурорами вимог щодо несумісності?","answers":["Офісу Генерального прокурора;","Вищої кваліфікаційної комісії суддів України;","Вищої ради правосуддя;","Конституційного Суду України."],"correct":2},{"num":67,"q":"Яким органом, згідно з Конституцією України, є Рада національної безпеки і оборони України?","answers":["консультативним органом;","дорадчим органом;","координаційним органом;","правоохоронним органом."],"correct":2},{"num":68,"q":"Чи є чинними нормативні акти, прийняті до набуття чинності Конституцією України?","answers":["втратили чинність тільки ті нормативні акти, перелік яких визначено у Конституції України;","є чинними у частині, що не суперечить Конституції України;","набуття чинності Конституцією не впливає на чинність нормативних актів.;","чинним є лише перелік нормативних актів, визначений у Конституції України."],"correct":1},{"num":69,"q":"Яким джерелом керувалася Верховна Рада України, приймаючи Конституцію України, згідно з її преамбулою?","answers":["Актом проголошення незалежності України;","Декларацією про державний суверенітет України;","Загальною декларацією прав людини;","Конвенцією про захист прав людини основоположних свобод."],"correct":0},{"num":70,"q":"Яке державне свято закріплено Конституцією України?","answers":["День Соборності України;","День Конституції України;","День незалежності України;","Конституцією України не закріплено жодного державного свята."],"correct":1},{"num":71,"q":"Які нормативні акти ухвалює Конституційний Суд України щодо офіційного тлумачення законів України?","answers":["постанови;","рішення;","роз'яснення;","ухвали."],"correct":1},{"num":72,"q":"Вивченню яких мов сприяє держава, відповідно до Конституції України?","answers":["української та російської мови;","української мови;","мов міжнародного спілкування;","ycix мов."],"correct":2},{"num":73,"q":"На чому ґрунтується шлюб, відповідно до Конституції України?","answers":["рівноправній згоді жінки і чоловіка;","шлюбному договорі жінки і чоловіка;","вільній згоді жінки і чоловіка;","законному волевиявленню жінки і чоловіка."],"correct":2},{"num":74,"q":"Хто здійснює виконавчу владу в областях і районах, містах Києві та Севастополі?","answers":["місцеві територіальні громади;","органи територіальної самоорганізації населення;","місцеві державні адміністрації;","виконавчі комітети місцевих рад."],"correct":2},{"num":75,"q":"Хто призначає голів місцевих державних адміністрацій?","answers":["Президент України за згодою Верховної Ради України;","Президент України за поданням Кабінету Міністрів України;","Президент України за поданням голови відповідної місцевої ради;","Кабінет Міністрів України за поданням Президента України."],"correct":1},{"num":76,"q":"Хто, згідно з Конституцією України, є Верховним Головнокомандувачем Збройних Сил України?","answers":["Секретар Ради національної безпеки і оборони України;","Начальник Генерального штабу України;","Президент України;","Міністр оборони України."],"correct":2},{"num":77,"q":"До якого органу і ким може бути поданий законопроект про внесення змін до Конституції України?","answers":["До Президента України Кабінетом Міністрів України за умови попереднього схвалення законопроєкту Конституційним Судом України;","До Верховної Ради України Конституційним Судом України або не менш як половиною народних депутатів України від конституційного складу Верховної Ради України;","До Верховної Ради України Прем’єр-міністром України або не менш як половиною присутніх на засіданні Верховної Ради України народних депутатів України;","До Верховної Ради України Президентом України, або не менш як третиною народних депутатів України від конституційного складу Верховної Ради України."],"correct":3},{"num":78,"q":"Хто має право на страйк згідно з Конституцією України?","answers":["ті, хто мають право на працю;","лише громадяни України, які працюють;","ті, хто працює;","ті, хто на законних підставах перебувають на території України."],"correct":2},{"num":79,"q":"Яким органом, згідно з Конституцією України, можуть встановлюватися обмеження щодо реалізації права на проведення зборів, мітингів, походів та демонстрацій?","answers":["сільським, селищним або міським головою;","виконкомом місцевої ради;","судом;","районною державною адміністрацією."],"correct":2},{"num":80,"q":"Які наслідки має відставка Прем’єр-міністра України, згідно з Конституцією України?","answers":["Відставку лише Першого віце-прем’єр-міністра;","призначення Президентом України виконуючим обов'язки Прем'єр-міністра Першого віце-прем’єр-міністра;","дострокове припинення повноважень Верховної Ради України;","відставку всього складу Кабінету Міністрів України."],"correct":3},{"num":81,"q":"Яку ідеологію держава може визнати обов’язковою, згідно з Конституцією України?","answers":["ідеологію, котра безпосередньо пов'язана з національною ідеєю або є ідеологією загальнолюдських цінностей;","ліберальну ідеологію лише за умови, що вона не містить людиноненависницьких антигуманних чи тоталітарних ідей;","ідеологію, котра на думку більшості народних депутатів України сприятиме консолідації суспільства;","держава не може визнати обов'язковою жодну ідеологію."],"correct":3},{"num":82,"q":"Чи допускає Конституція України примушування особи до здійснення дій або виконання обов’язків, не передбачених законодавством?","answers":["не допускається примушування особи робити те, що не передбачено законодавством;","допускає уповноваженою посадовою особою під час порушення порядку проведення масових публічних заходів;","допускає за умови крайньої необхідності й лише уповноваженою посадовою особою;","допускає уповноваженою посадовою особою під час проведення слідчих дій."],"correct":0},{"num":83,"q":"Як визначається в Конституції України малий Державний Герб України?","answers":["малим Державним Гербом України є триденс;","малим Державним Гербом України є Знак Княжої Держави Володимира Великого;","малим Державним Гербом України є герб Війська Запорізького;","малим Державним Гербом України є скіпетр."],"correct":0},{"num":84,"q":"Чи має право особа звертатися за захистом своїх прав до міжнародних судових установ?","answers":["ні, особа не має такого права;","так, але лише після використання всіх національних засобів правового захисту;","так, але лише після звернення до Уповноваженого Верховної Ради України з прав людини;","так, але лише у випадку, коли особа вважає незаконним судове рішення."],"correct":1},{"num":85,"q":"До настання якого часу батьки зобов’язані утримувати своїх дітей згідно з Конституцією України?","answers":["до досягнення ними 16 років;","до здобуття ними загальної середньої освіти;","до їх повноліття;","до здобуття ними вищої освіти."],"correct":2},{"num":86,"q":"На вимогу якої мінімальної кількості громадян, згідно з Конституцією України, проголошується всеукраїнський референдум за народною ініціативою?","answers":["одного мільйона;","двох мільйонів;","п'яти мільйонів;","трьох мільйонів."],"correct":3},{"num":87,"q":"Яким чином, згідно з Конституцією України, має вирішуватися питання про зміну території України?","answers":["виключно всеукраїнським референдумом;","на вимогу не менше п'яти мільйонів громадян України;","лише Верховною Радою України;","винятково Президентом України."],"correct":0},{"num":88,"q":"Яким актом, згідно з Конституцією України, визначаються повноваження народних депутатів?","answers":["Конституцією та законами України; лише Конституцією України;","Конституцією України, законами України, указами Президента України та постановами Кабінету Міністрів України;","Конституцією України та всеукраїнським референдумом."],"correct":0},{"num":89,"q":"З якого моменту Конституція України визначає початок повноважень народного депутата України?","answers":["з моменту видачі посвідчення народного депутата України;","з моменту обрання народним депутатом України;","з моменту офіційного оприлюднення списків народних депутатів України;","з моменту складення присяги народним депутатом України."],"correct":3},{"num":90,"q":"Чи несуть, згідно з Конституцією України, народні депутати України юридичну відповідальність за висловлювання на засіданні Верховної Ради України?","answers":["народні депутати України несуть лише політичну відповідальність за висловлювання на засіданні Верховної Ради України;","народні депутати України не несуть юридичної відповідальності за висловлювання на засіданні Верховної Ради України;","народні депутати України несуть юридичну відповідальність за висловлювання на засіданні Верховної Ради України на загальних підставах;","народні депутати України не несуть юридичної відповідальності за висловлювання на засіданні Верховної Ради України, за винятком відповідальності за образу чи наклеп."],"correct":1},{"num":91,"q":"Хто, згідно з Конституцією України, має відкривати перше засідання Верховної Ради України?","answers":["найстарший за віком народний депутат України;","Голова Погоджувальної Ради депутатських фракцій;","Голова Центральної виборчої комісії України;","Голова Верховної Ради України попереднього скликання."],"correct":0},{"num":92,"q":"В якому порядку, за загальним правилом, Верховна Рада України приймає закони та інші правові акти?","answers":["більшістю від її конституційного складу;","третиною голосів народних депутатів України;","трьома четвертими голосів народних депутатів України;","кваліфікованою більшістю від її конституційного складу."],"correct":0},{"num":93,"q":"Хто здійснює парламентський контроль за додержанням конституційних прав і свобод людини і громадянина згідно з Конституцією України?","answers":["Уповноважений Верховної Ради України з прав людини;","тимчасова слідча комісія Верховної Ради України з питань стану додержання прав людини в Україні;","Комітет Верховної Ради України з питань законності та правопорядку;","Президент України."],"correct":0},{"num":94,"q":"На підставі чого, згідно з Конституцією України, гарантується звернення особи до суду для захисту конституційних прав і свобод людини і громадянина?","answers":["безпосередньо на підставі Конституції України;","безпосередньо на підставі Конституції України та відповідно до Закону України \"Про судоустрій та статус суддів\";","за загальним правилом на підставі Конституції України, але з винятками, зазначеними в Конституції та законах України;","на підставі паспорта громадянина України."],"correct":0},{"num":95,"q":"Яким чином, згідно з Конституцією України, враховуються релігійні переконання громадянина у разі якщо вони суперечать виконанню військового обов'язку?","answers":["виконання військового обов'язку має бути замінене альтернативною (невійськовою) службою;","громадянин звільняється від виконання військового обов'язку за умови виконання ним громадських робіт;","громадянин звільняється від виконання військового обов'язку;","релігійні переконання громадянина не враховуються при виконанні військового обов'язку."],"correct":0},{"num":96,"q":"За чиїм рішенням, згідно з Конституцією України, може бути застосована конфіскація майна?","answers":["виключно за рішенням суду;","конфіскація особистого майна не допускається;","за рішенням органу досудового розслідування;","за рішенням Європейського суду з прав людини."],"correct":0},{"num":97,"q":"Чи можлива, відповідно до Конституції України, заборона страйку?","answers":["можлива лише на підставі рішення власника підприємства, установи, організації;","можлива лише на підставі закону;","можлива лише на підставі рішення голови місцевої державної адміністрації;","неможлива."],"correct":1},{"num":98,"q":"Ким, відповідно до Конституції України, відшкодовується матеріальна і моральна шкода, завдана безпідставним засудженням, у разі скасування вироку суду як неправосудного?","answers":["стороною державного обвинувачення;","державою;","Міністерством юстиції України;","судом, що виніс неправосудний вирок."],"correct":1},{"num":99,"q":"За винятком яких обмежень засуджений користується правами людини і громадянина відповідно до Конституції України?","answers":["які визначені законом і встановлені вироком суду;","які встановлені вироком суду та внутрішнім розпорядком місця відбування покарання;","які встановлені рішенням суду за зверненням Державної судової адміністрації України;","які встановлені вироком суду за зверненням прокурора."],"correct":0},{"num":100,"q":"Ким схвалюється, відповідно до Конституції України, рішення Президента України про використання Збройних Сил України та інших військових формувань у разі збройної агресії проти України?","answers":["це рішення не потребує жодного схвалення, оскільки Президент України є Верховним головнокомандувачем;","Верховною Радою України;","Кабінетом Міністрів України;","Радою національної безпеки і оборони України."],"correct":1},{"num":101,"q":"Яке значення для слідства і суду мають висновки тимчасових слідчих комісій Верховної Ради України відповідно до Конституції України?","answers":["вони не є вирішальними для слідства і суду;","вони є обов'язковими для слідства і суду;","вони є обов'язковими для суду;","вони є обов'язковими для органів досудового слідства."],"correct":0},{"num":102,"q":"Якою відповідно до Конституції України, є основна функція центрального банку держави - Національного банку України?","answers":["забезпечення стабільності гривні;","формування та розпорядження золотовалютними резервами України;","контроль та нормативно-правове регулювання діяльності комерційних банківських установ на території України;","видача рефінансування комерційним банкам для підтримання їх ліквідності."],"correct":0},{"num":103,"q":"З якого моменту, згідно з Конституцією України, громадянин має право користуватися правовою допомогою захисника?","answers":["моменту арешту;","затримання;","початку досудового розслідування;","внесення відомостей про злочин до ЄРДР."],"correct":1},{"num":104,"q":"Чи потрібен, згідно з Конституцією України, попередній дозвіл на утворення профспілки, і якщо так, то який суб'єкт надає такий дозвіл?","answers":["Так, потрібен; територіальний орган Міністерства юстиції України;","Ні, для утворення профспілки попередній дозвіл не потрібен;","Так, потрібен; відповідний місцевий орган виконавчої влади;","Так, потрібен; власник підприємства, установи, організації."],"correct":1},{"num":105,"q":"Від чийого імені, згідно з Конституцією України, здійснюється контроль за використанням коштів Державного бюджету України Рахунковою палатою?","answers":["від імені України;","від імені народу України;","від імені Національного Банку України;","від імені Верховної Ради України."],"correct":3},{"num":106,"q":"Що, згідно з Конституцією України, забезпечує держава стосовно судді та його оточення?","answers":["особисту безпеку суддів, його сім'ї та близьких родичів, коло яких визначається законом;","особисту безпеку судді, його сім’ї та безпеку їх майна;","особисту безпеку судді та безпеку його майна;","особисту безпеку судді та членів його сім’ї."],"correct":3},{"num":107,"q":"Хто, відповідно до Конституції України, входить до складу Кабінету Міністрів України?","answers":["Прем'єр-міністр України, заступник прем'єр-міністра, віце-прем'єр\u0002міністри, міністри;","Прем'єр-міністр України, Перший віце-прем’єр-міністр, віце\u0002прем’єр- міністри, міністри;","Прем'єр-міністр України, заступник прем'єр-міністра, Перший віце-прем'єр\u0002міністр, віце-прем'єр-міністри, міністри;","Прем'єр-міністр України, Перший віце-прем'єр-міністр, три віце-прем'єр\u0002міністри, міністри."],"correct":1},{"num":108,"q":"Чи здійснюється відповідно до Конституції України цензура?","answers":["так, спеціально уповноваженим центральним органом виконавчої влади;","так, власниками ЗМІ, які самостійно визначають редакційну політику;","так, експертами з державних таємниць;","ні, Конституцією України цензура заборонена."],"correct":3},{"num":109,"q":"Яку благодійницьку діяльність заохочує і підтримує держава, відповідно до Конституції України?","answers":["благодійницьку діяльність щодо дітей;","благодійницьку діяльність волонтерів;","благодійницьку діяльність щодо Збройних Сил України;","благодійницьку діяльність щодо соціально-незахищених верств населення."],"correct":0},{"num":110,"q":"Яким чином, відповідно до Конституції України, гарантується право громадян, які належать до національних меншин, вивчати рідну мову?","answers":["через мережу національних навчальних закладів, що фінансуються з державного та місцевих бюджетів або через національні культурні товариства;","через державну підтримку національних навчально-культурних програм або через національні культурні товариства;","через вивчення рідної мови у державних і комунальних навчальних закладах або через національні культурні товариства;","через державну підтримку національних навчально-культурних програм або право на вивчення рідної мови у державних навчальних закладах."],"correct":2},{"num":111,"q":"До якого суб’єкта/суб’єктів, згідно з Конституцією України, має право звертатися особа за захистом своїх прав і свобод після використання всіх національних засобів правового захисту, окрім міжнародних судових установ?","answers":["До відповідних органів міжнародних організацій, членом або учасником яких є Україна;","До урядів іноземних держав, з якими Україною укладені відповідні міжнародні договори;","До посадових та службових осіб координаційних органів міждержавних союзів, членом або учасником яких є Україна;","До іноземних держав, з якими України підтримує дипломатичні зносини."],"correct":0},{"num":112,"q":"Якщо закон чи інший нормативно-правовий акт, що визначає права і обов’язки громадян, не був доведений до відома населення у порядку, встановленому законом, які це має наслідки згідно з Конституцією України?","answers":["Такий закон чи нормативно-правовий акт призупиняє свою дію до тих пір, поки не буде доведений до відома населення;","Такий закон чи нормативно-правовий акт є нечинним;","Такий закон чи нормативно-правовий акт є чинним, якщо опублікований у порядку встановленому Указом Президента України «Про порядок офіційного оприлюднення та набрання чинності нормативно-правовими актами України»;","Такий закон чи нормативно-правовий акт є обов’язковим для усіх з моменту ухвалення."],"correct":0},{"num":113,"q":"Хто відповідно до Конституції України, затверджує рішення про одержання Україною від іноземних держав, банків і міжнародних фінансових організацій позик, не передбачених Державним бюджетом України?","answers":["Кабінет Міністрів України;","Рахункова палата;","Верховна Рада України;","Президент України."],"correct":2},{"num":114,"q":"До чиїх повноважень, відповідно до Конституції України, належить встановлення і зміна меж районів і міст, найменування і перейменування населених пунктів?","answers":["Кабінету Міністрів України;","Територіальної громади;","Відповідної місцевої ради;","Верховної Ради України."],"correct":3},{"num":115,"q":"Хто, відповідно до Конституції України, присвоює вищі спеціальні звання і класні чини?","answers":["Керівники відповідних військових формувань та Генеральний прокурор;","Міністр оборони України і Генеральний прокурор;","Міністр оборони України;","Президент України."],"correct":3},{"num":116,"q":"Хто приймає рішення про припинення громадянства України?","answers":["Державна міграційна служба України;","Міністерство юстиції України;","Президент України;","Виключно суд."],"correct":2},{"num":117,"q":"Кому, відповідно до Конституції України, має бути негайно повідомлено про арешт чи затримання особи?","answers":["слідчому судді;","родичам заарештованого чи затриманого;","адвокату затриманого чи заарештованого;","самому затриманому чи заарештованому."],"correct":1},{"num":118,"q":"Чи може людина, згідно з Конституцією України, бути піддана медичним дослідам?","answers":["Людина може бути піддана медичним дослідам за її вільної згоди;","Людина не може бути піддана медичним дослідам за жодних умов;","Людина може бути піддана медичним дослідам за рішенням суду;","Людина може бути піддана медичним дослідам за рішенням адміністрації державного медичного закладу."],"correct":0},{"num":119,"q":"Чи може, згідно з Конституцією України, громадянин України бути позбавлений права повернутися в Україну?","answers":["громадянин України може бути позбавлений права повернутися в Україну у разі, якщо він був засуджений в іншій державі за вчинення тяжкого або особливо тяжкого злочину;","громадянин України не може бути позбавлений права в будь-який час повернутися в Україну;","громадянин України може бути позбавлений права повернутися в Україну у разі, якщо він публічно висловлювався на підтримку злочинних організацій, які мають на меті порушення територіальної цілісності України;","громадянин України може бути позбавлений права повернутися в Україну у разі, якщо він систематично займається дискредитацією української державності."],"correct":1},{"num":120,"q":"Що, згідно з Конституцією України, є метою участі громадян у професійних спілках?","answers":["Захист своїх трудових і соціально-економічних прав та інтересів;","Захист своїх трудових, культурних та економічних прав та інтересів;","Захист своїх трудових прав та інтересів відповідно до Закону України «Про порядок вирішення колективних трудових спорів (конфліктів)»;","Захист своїх трудових, політичних і соціально-економічних прав та інтересів."],"correct":0},{"num":121,"q":"Хто, згідно з Конституцією України, може бути членом політичної партії?","answers":["Як громадяни України, так і іноземці;","Усі, хто на законних підставах перебуває на території України;","Громадяни України, іноземці та особи без громадянства;","Лише громадяни України."],"correct":3},{"num":122,"q":"Ким згідно з Конституцією України, призначається Міністр оборони України?","answers":["Президентом України за поданням Прем’єр-міністра України;","Верховною Радою України за поданням Президента України;","Президентом України за поданням Ради національної безпеки і оборони України;","Президентом України за згодою Верховної Ради України."],"correct":1},{"num":123,"q":"Яким органом, згідно з Конституцією України, можуть бути встановлені обмеження щодо реалізації права на проведення зборів, мітингів, походів та демонстрацій?","answers":["Судом відповідно до закону;","Сільським, селищним або міським головою відповідно до наданих йому повноважень - на вулицях та майданах, де їх проводити заборонено;","Районною державною адміністрацією відповідно до її повноважень;","Конституційним Судом України, відповідно до закону."],"correct":0},{"num":124,"q":"Чи має право або обов'язок особа, відповідно до Конституції України, захищати життя і здоров'я інших людей?","answers":["Це конституційний обов’язок кожної людини;","Має право, якщо вони зазнали протиправного посягання;","Має право захищати лише себе і тільки за умови дотримання вимог необхідної оборони;","Має право захищати будь-яких осіб у будь-який спосіб та незалежно від обставин."],"correct":1},{"num":125,"q":"Про що, відповідно до Конституції України, передусім має бути невідкладно повідомлено особі у разі їїзатримання уповноваженими посадовими особами?","answers":["Про строк, на який її затримано;","Про її обов’язок давати показання і пояснення за висунутим проти неї звинуваченням;","Про органи державної влади та їх посадових осіб, до яких можна звернутися для отримання інформації про причини затримання;","Про мотиви її затримання."],"correct":3},{"num":126,"q":"Де, відповідно до Конституції України, НЕ допускається створення і діяльність організаційних структур політичних партій?","answers":["У національно-культурних товариствах;","У професійних спілках;","На підприємствах, установах, організаціях, незалежно від форм власності та господарювання;","У військових формуваннях."],"correct":3},{"num":127,"q":"За яких умов, згідно з Конституцією України, можливе примусове відчуження об’єктів права приватної власності з наступним відшкодуванням їх вартості?","answers":["Можливе лише за умови наявності суспільної потреби;","Можливе в умовах надзвичайного чи воєнного стану;","Можливе за умови наявності судового рішення;","Неможливе ні за яких умов."],"correct":1},{"num":128,"q":"Кому належить право визначати і змінювати конституційний лад в Україні?","answers":["Верховній Раді Україні;","Конституційному Суду України;","Президентові України;","Виключно народові."],"correct":3},{"num":129,"q":"Що відповідно до Конституції України є головним обов’язком держави?","answers":["забезпечення економічної самостійності;","збереження територіальної цілісності;","утвердження і забезпечення прав і свобод людини;","захист суверенітету та забезпечення обороноздатності."],"correct":2},{"num":130,"q":"Що визначає зміст та спрямованість держави відповідно до Конституції України?","answers":["права і свободи людини та їх гарантії;","забезпечення консолідації та розвитку української нації;","укладання та виконання міжнародних договорів;","забезпечення ефективної роботи органів державної влади."],"correct":0},{"num":131,"q":"Що гарантується нормами Конституції України як нормами прямої дії?","answers":["загальні підстави для звернення людини і громадянина до суду за захистом їхніх прав;","звернення до адміністративного суду для захисту прав і свобод людини і громадянина у публічно-правових спорах;","звернення до суду для захисту конституційних прав і свобод людини і громадянина безпосередньо на підставі Конституції України;","захист прав і свобод людини і громадянина у позасудовому порядку."],"correct":2},{"num":132,"q":"Чи може громадянин України бути позбавлений громадянства?","answers":["Так, може, у випадку виїзду за кордон на постійне місце проживання;","Так, може, у випадках, передбачених міжнародними угодами, згоду на обов’язковість яких надала Верховна Рада України;","Так, може, у випадку вчинення ним тяжкого чи особливо тяжкого злочину;","Ні, не може."],"correct":3},{"num":133,"q":"Хто повинен відшкодовувати матеріальну та моральну шкоду, завдану безпідставним засудженням, у разі скасування вироку суду як неправосудного?","answers":["Прокурор, який підтримував обвинувачення;","Держава;","Суд (суддя), який виніс неправосудний вирок, що був скасований;","Міжнародні правозахисні інституції."],"correct":1},{"num":134,"q":"Чи встановлено Конституцією України обмеження щодо права на мирні зібрання?","answers":["проведення мирних зібрань допускається за умови визначення меж органами виконавчої влади чи місцевого самоврядування;","проведення мирних зібрань не передбачає обмежень;","проведення мирних зібрань передбачає завчасне інформування органів державної влади, якими може бути обмежене в інтересах національної безпеки та громадського порядку;","обмеження щодо реалізації права на мирні зібрання може встановлюватися судом лише в інтересах національної безпеки та громадського порядку."],"correct":3},{"num":135,"q":"Яким є зміст презумпції невинуватості за Конституцією України?","answers":["особа має право доводити свою невинуватість у вчиненні злочину;","юридична відповідальність особи встановлюється згідно із законом;","особа вважається невинуватою, доки її вину не буде в законному порядку встановлено обвинувальним вироком суду;","особа має право на захист від обвинувачення."],"correct":2},{"num":136,"q":"Щодо яких законопроектів відповідно до Конституції України не допускається проведення референдуму?","answers":["з питань податків, бюджету та форм власності;","з питань податків, бюджету та амністії;","з питань внесення змін до Конституції України;","з питань податків, бюджету та перейменування національної грошової одиниці."],"correct":0},{"num":137,"q":"Які питання вирішуються виключно всеукраїнським референдумом?","answers":["про внесення змін до Конституції України;","про зміну конституційного ладу України;","про зміну території України;","про зміну державних символів України."],"correct":2},{"num":138,"q":"Кому із перелічених суб’єктів належить право законодавчої ініціативи у Верховній Раді України?","answers":["Уповноваженому Верховної Ради України з прав людини;","Прем’єр-міністрові України;","Народним депутатам України;","Національному банку України."],"correct":2},{"num":139,"q":"Чи може (вправі) Президент України передавати свої повноваження іншим особам або органам?","answers":["може, тільки Прем’єр-міністрові України, у передбачених законом випадках;","може, тільки Голові Верховної Ради України, у передбачених законом випадках, не може;","не може (без спеціальної згоди парламенту)."],"correct":1},{"num":140,"q":"Чи користується Президент України правом недоторканності?","answers":["так, на час виконання повноважень;","ні, не користується;","так, пожиттєво;","користується у випадках, визначених Законом України «Про Президента України»."],"correct":0},{"num":141,"q":"Визначте, які з перелічених повноважень відповідно до Конституції України покладаються на Президента України?","answers":["призначає Міністра оборони України;","оголошує амністію;","здійснює помилування;","припиняє повноваження суддів."],"correct":2},{"num":142,"q":"Вкажіть, що із названого є підставою для усунення Президента України з поста в порядку імпічменту відповідно до Конституції України?","answers":["вчинення ним державної зради, іншого злочину або адміністративного правопорушення;","лише вчинення ним державної зради;","вчинення ним державної зради або іншого злочину;","вчинення ним адміністративного правопорушення."],"correct":2},{"num":143,"q":"Якою найменшою кількістю голосів від конституційного складу Верховної Ради України ініціюється питання про усунення Президента України з поста в порядку імпічменту?","answers":["двома третинами;","однією третиною;","трьома четвертими;","більшістю."],"correct":3},{"num":144,"q":"У разі дострокового припинення повноважень Президента України відповідно до статей 108, 109, 110, 111 Конституції України, на кого покладається виконання обов’язків Президента України на період до обрання і вступу на пост нового Президента України?","answers":["на обрану Верховною Радою України посадову особу;","на Секретаря Ради національної безпеки і оборони України;","на Прем’єр-міністра України;","на Голову Верховної Ради України."],"correct":3},{"num":145,"q":"Кому відповідно до Конституції України підконтрольний і підзвітний Кабінет Міністрів України в межах, передбачених Конституцією України?","answers":["Верховній Раді України;","Раді національної безпеки і оборони України;","Конституційному Суду України;","Прем’єр-міністру України."],"correct":0},{"num":146,"q":"Що із переліченого має наслідком відставку всього складу Кабінету Міністрів України?","answers":["усунення Президента України в порядку імпічменту;","дострокове припинення повноважень Першого віце-прем’єр-міністра України;","складення повноважень більшістю членів Кабінету Міністрів України;","прийняття резолюції недовіри Кабінету Міністрів України."],"correct":3},{"num":147,"q":"Ким і за яких умов, визначених Конституцією України, може бути застосована конфіскація майна?","answers":["за рішенням слідчого чи прокурора для забезпечення відшкодування шкоди, завданої злочином;","за рішенням суду у випадках, обсязі та порядку, встановлених законом;","за рішенням керівника органу прокуратури для забезпечення відшкодування шкоди, завданої злочином;","за рішенням керівника органу досудового розслідування у порядку, встановленому законом."],"correct":1},{"num":148,"q":"Який правовий статус Ради національної безпеки і оборони України відповідно до Конституції України?","answers":["науково-консультативний орган з питань оборони і національної безпеки при Президентові України;","координаційний орган з питань оборони і національної безпеки при Президентові України;","вищий орган у галузі оборони і національної безпеки при Президентові України;","дорадчий орган з питань оборони і національної безпеки при Президентові України.","Закон України «"],"correct":1}]},{"name":"Закон України «Про запобігання корупції»","questions":[{"num":1,"q":"Що означає потенційний конфлікт інтересів згідно із Законом України «Про запобігання корупції»?","answers":["може існувати лише за наявності майнового приватного інтересу, а немайнові інтереси (дружба, родинні стосунки) до нього не відносяться;","наявність у особи приватного інтересу у сфері, в якій вона виконує свої службові чи представницькі повноваження, що може вплинути на об'єктивність чи неупередженість прийняття нею рішень або на вчинення чи невчинення дій під час виконання зазначених повноважень;","суперечність між приватним інтересом особи та ї службовими чи представницькими повноваженнями, що впливає на об'єктивність або неупередженість прийняття рішень, або на вчинення чи невчинення дій під час виконання зазначених повноважень;","будь-який майновий чи немайновий інтерес особи, у тому числі зумовлений особистими, сімейними, дружніми чи іншими позаслужбовими стосунками з фізичними чи юридичними особами."],"correct":1},{"num":2,"q":"Хто із зазначених осіб для цілей Закону України «Про запобігання корупції» прирівнюється до осіб, уповноважених на виконання функцій держави або місцевого самоврядування?","answers":["військовослужбовці строкової військової служби;","особи, які призначені опікунами та піклувальниками в установленому порядку;","особи, які несуть повну матеріальну відповідальність;","особи, які не є державними службовцями, посадовими особами місцевого самоврядування, але надають публічні послуги."],"correct":3},{"num":3,"q":"На яких із зазначених у переліку осіб НЕ поширюється дія Закону України «Про запобігання корупції»?","answers":["на військовослужбовців строкової військової служби;","на військових посадових осіб Збройних Сил України;","на військових посадових осіб Державної служби спеціального зв'язку та захисту інформації;","на військових посадових осіб інших утворених відповідно до законів України військових формувань."],"correct":0},{"num":4,"q":"Питання діяльності Національного агентства з питань запобігання корупції у Кабінеті Міністрів України, згідно із Законом України «Про запобігання корупції, представляє:","answers":["Члени Національного агентства з питань запобігання корупції;","Голова та члени Національного агентства з питань запобігання корупції;","Голова Національного агентства з питань запобігання корупції;","Голова Національного агентства з питань запобігання корупції та його заступники."],"correct":2},{"num":5,"q":"Який орган визначає засади антикорупційної політики (Антикорупційну стратегію) України, згідно із Законом України «Про запобігання корупції»?","answers":["Кабінет Міністрів України;","Національне агентство з питань запобігання корупції, Президент України;","Верховна Рада України."],"correct":2},{"num":6,"q":"Де САМЕ оприлюднюється національна доповідь щодо реалізації антикорупційної політики, згідно із Законом України «Про запобігання корупції»?","answers":["на офіційному веб-сайті Верховної Ради України;","на офіційному веб-сайті Президента України;","на офіційному веб-сайті Національного агентства з питань запобігання корупції;","на офіційному веб-сайті Кабінету Міністрів України."],"correct":2},{"num":7,"q":"Які з вказаних відносин охоплюються поняттям «пряме підпорядкування», згідно із Законом України «Про запобігання корупції»?","answers":["відносини прямої організаційної або правової залежності підлеглої особи від її керівника;","відносини підлеглої особи та її керівника щодо надання та виконання вказівок і доручень;","відносини тільки прямої правової залежності підлеглої особи від її керівника;","відносини тільки прямої організаційної залежності підлеглої особи від її керівника."],"correct":0},{"num":8,"q":"Хто із зазначених у переліку осіб, згідно із Законом України «Про запобігання корупції», належить до близьких осіб особи, уповноваженої на виконання функцій держави або місцевого самоврядування?","answers":["особи, які раніше перебували у шлюбі з особою, уповноваженою на виконання функцій держави або місцевого самоврядування;","особи, взаємні права та обов'язки яких із особою, уповноваженою на виконання функцій держави або місцевого самоврядування, не мають характеру сімейних;","особи, які не пов'язані спільним побутом із особою, уповноваженою на виконання функцій держави або місцевого самоврядування;","особа, яка перебуває під опікою або піклуванням особи, уповноваженої на виконання функцій держави або місцевого самоврядування."],"correct":3},{"num":9,"q":"Які види юридичної відповідальності згідно із Законом України «Про запобігання корупції» можуть настати за вчинення корупційного правопорушення?","answers":["адміністративна, дисциплінарна та цивільно-правова відповідальність;","адміністративна та цивільно-правова відповідальність;","кримінальна, дисциплінарна та/або цивільно-правова відповідальність;","кримінальна, адміністративна та дисциплінарна відповідальність."],"correct":2},{"num":10,"q":"Що означає поняття «неправомірна вигода» відповідно до Закону України «Про запобігання корупції»?","answers":["речі матеріального світу, які обіцяють, пропонують, надають або одержують без законних на те підстав;","переваги, пільги, послуги, нематеріальні активи, які надають/одержують безоплатно або за ціною, нижчою мінімальної ринкової;","продукти харчування, спиртні напої та тютюнові вироби, незалежно від їх вартості, а також грошові кошти, товари, послуги, роботи, пільги, переваги, подарункові сертифікати, цінні папери, кредити, лотерейні білети, інші матеріальні та нематеріальні активи, вартість яких перевищує 0,06 неоподатковуваного мінімуму доходів громадян, які обіцяють, пропонують або надають без законних на те підстав;","грошові кошти або інше майно, переваги, пільги, послуги, нематеріальні активи, будь-які інші вигоди нематеріального чи негрошового характеру, які обіцяють, пропонують, надають або одержують без законних на те підстав."],"correct":3},{"num":11,"q":"Що означає суперечність між приватним інтересом особи та її службовими чи представницькими повноваженнями, що впливає на об’єктивність чи неупередженість прийняття рішень, або на вчинення чи невчинення дій під час виконання зазначених повноважень, згідно із Законом України «Про запобігання корупції»?","answers":["перевищення службових повноважень;","реальний конфлікт інтересів;","службова недбалість;","потенційний конфлікт інтересів."],"correct":1},{"num":12,"q":"Які із перелічених державних органів належать до спеціально уповноважених суб’єктів у сфері протидії корупції, згідно із Законом України «Про запобігання корупції»?","answers":["Рада національної безпеки і оборони України:","Служба безпеки України;","Національна поліція України Міністерство юстиції України."],"correct":2},{"num":13,"q":"Хто із зазначених осіб згідно з Законом України «Про запобігання корупції» належить до виборних осіб?","answers":["ректор університету;","Голова Національного антикорупційного бюро України;","міський голова;","Премʼєр-міністр України."],"correct":2},{"num":14,"q":"Ким утворюється Національне агентство з питань запобігання корупції, згідно із Законом України «Про запобігання корупції»?","answers":["Кабінетом Міністрів України;","Міністерством юстиції України;","Президентом України;","Верховною Радою України."],"correct":0},{"num":15,"q":"Хто здійснює керівництво діяльністю Національного агентства з питань запобігання корупції?","answers":["його Голова та члени;","Кабінет Міністрів України;","його Голова;","його Голова та заступник."],"correct":2},{"num":16,"q":"На який строк призначається Голова Національного агенства з питань запобігання корупції?","answers":["строком на 4 роки;","строком на 5 років;","строком на 2 роки;","строком на 3 роки."],"correct":0},{"num":17,"q":"Ким може бути здійснено повідомлення про підозру у вчиненні кримінального правопорушення члену Національного агентства з питань запобігання корупції, згідно із Законом України «Про запобігання корупції»?","answers":["Генеральним прокурором (виконувачем обов’язків Генерального прокурора) або заступником Генерального прокурора - керівником Спеціалізованої антикорупційної прокуратури;","Міністром внутрішніх справ України за поданням Генерального прокурора України;","Міністром внутрішніх справ України;","Головою Служби безпеки України."],"correct":0},{"num":18,"q":"Повноваженням якого органу є проведення аналізу стану запобігання та протидії корупції Україні, згідно із Законом України «Про запобігання корупції»?","answers":["Національного агентства з питань запобігання корупції;","Кабінету Міністрів України;","Національного антикорупційного бюро України;","Міністерства внутрішніх справ України."],"correct":0},{"num":19,"q":"Який орган затверджує Антикорупційну стратегію відповідно до Закону України «Про запобігання корупції»?","answers":["Національне агентство з питань запобігання корупції;","Кабінет Міністрів України;","Національне антикорупційне бюро України;","Верховна Рада України."],"correct":2},{"num":20,"q":"Коли Верховна Рада України проводить парламентські слухання з питань ситуації щодо корупції, згідно із Законом України «Про запобігання корупції»?","answers":["щороку не пізніше 1 червня;","щороку не пізніше 1 квітня;","щороку не пізніше 1 грудня;","щороку не пізніше 1 лютого."],"correct":0},{"num":21,"q":"Яким державним органом визначаються засади антикорупційної стратегії, згідно із Законом України «Про запобігання корупції»?","answers":["Верховною Радою України;","Національним агентством з питань запобігання корупції;","Кабінетом Міністрів України;","Національним антикорупційним бюро України."],"correct":1},{"num":22,"q":"Подарунки (що відповідають загальновизнаним уявленням про гостинність) якої вартості може прийняти посадова особа Бюро економічної безпеки України від однієї особи (групи осіб) протягом року, згідно із Законом України «Про запобігання корупції»?","answers":["сукупна вартість яких не перевищує двох умовних розрахункових одиниць, встановлених на 1 січня того року, в якому прийнято подарунки;","сукупна вартість яких не перевищує двох неоподатковуваних мінімумів доходів громадян, встановлених на 1 січня того року, в якому прийнято подарунки;","сукупна вартість яких не перевищує двох прожиткових мінімумів, встановлених для працездатної особи на 1 січня того року, в якому прийнято подарунки;","сукупна вартість яких не перевищує двох мінімальних розмірів заробітних плат, встановлених на 1 січня того року, в якому прийнято подарунки."],"correct":1},{"num":23,"q":"Що саме визнається подарунком, згідно із Законом України «Про запобігання корупції»?","answers":["річ, яку дарувальник за власним бажанням і безоплатно дарує з метою доставити задоволення, користь одержувачеві подарунка;","грошові кошти або інше майно, переваги, пільги, послуги, нематеріальні активи, які надають/одержують безоплатно або за ціною, нижчою мінімальної ринкової;","грошові кошти або інше майно, переваги, пільги, послуги, нематеріальні активи, будь-які інші вигоди нематеріального чи негрошового характеру, які обіцяють, пропонують, надають або одержують без законних на те підстав;","будь-які блага, в тому числі прояви гостинності, які публічний службовець безоплатно або за вартістю, істотно меншою від ціни таких благ, одержує від фізичних чи
