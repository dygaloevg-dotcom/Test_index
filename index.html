        function saveStats() {
            try {
                // Зберегти і поточний індекс
                const dataToSave = {
                    ...stats,
                    currentIndex: currentIndex
                };
                localStorage.setItem('testStats', JSON.stringify(dataToSave));
            } catch (e) {
                console.log('Не вдалося зберегти прогрес');
            }
        }
        
        let stats = loadStats();
        let currentMode = 'flashcard';
        let selectedAnswer = null;
        let currentQuestions = [];
        
        // Embed questions directly
        
        questions = questionsData;
        initApp();
        
        function initApp() {
            
            currentQuestions = [...questions];
            
            // Populate topics
            const topics = [...new Set(questions.map(q => q.topic))];
            const select = document.getElementById('topicSelect');
            topics.forEach(topic => {
                const option = document.createElement('option');
                option.value = topic;
                option.textContent = topic;
                select.appendChild(option);
            });
            
            // Event listeners
            document.getElementById('topicSelect').addEventListener('change', filterByTopic);
            document.getElementById('shuffleBtn').addEventListener('click', shuffle);
            document.getElementById('resetStatsBtn').addEventListener('click', function() {
                if (confirm('Скинути статистику правильних/неправильних відповідей?\n\nПоточне питання НЕ зміниться.')) {
                    stats.correct = 0;
                    stats.wrong = 0;
                    saveStats();
                    updateStats();
                    alert('✅ Статистику скинуто!');
                }
            });
            
            
            
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentMode = e.target.dataset.mode;
                    showQuestion();
                });
            });
            
            updateStats();
            showQuestion();
        }
        
        function filterByTopic() {
            const topic = document.getElementById('topicSelect').value;
            if (topic === 'all') {
                currentQuestions = [...questions];
            } else {
                currentQuestions = questions.filter(q => q.topic === topic);
            }
            currentIndex = 0;
            showQuestion();
        }
        
        function shuffle() {
            currentQuestions = currentQuestions.sort(() => Math.random() - 0.5);
            currentIndex = 0;
            showQuestion();
        }
        
        
        
        function showQuestion() {
            if (currentQuestions.length === 0) return;
            
            const q = currentQuestions[currentIndex];
            selectedAnswer = null;
            
            // Find correct answer (typically the first option without semicolon or special marking)
            // For now, we'll assume first option is correct (you may need to mark correct answers)
            
            if (currentMode === 'flashcard') {
                document.getElementById('card').style.display = 'block';
                document.getElementById('quizMode').classList.add('hidden');
                
                // Скинути стан картки
                document.getElementById('cardFront').classList.add('active');
                document.getElementById('cardBack').classList.remove('active');
                
                document.getElementById('topicBadge').textContent = q.topic;
                document.getElementById('questionNumber').textContent = `Питання ${currentIndex + 1} з ${currentQuestions.length}`;
                document.getElementById('questionText').textContent = q.question;
                
                // Show all options as the answer
                // Перевірити чи є правильна відповідь
                if (q.correct_index === null) {
                    // Немає правильної відповіді - показати всі однаково
                    const answerHTML = q.options.map((opt, i) => 
                        `<div style="margin-bottom: 10px; padding-left: 35px; position: relative;">
                            <span style="position: absolute; left: 0; color: var(--blue-primary); font-weight: bold;">${String.fromCharCode(65 + i)}.</span>
                            ${opt}
                        </div>`
                    ).join('') + '<div style="margin-top: 20px; padding: 12px; background: #fff3cd; border-left: 4px solid #ffc107; border-radius: 8px; color: #856404;">⚠️ Для цього питання правильна відповідь не визначена</div>';
                    document.getElementById('answerText').innerHTML = answerHTML;
                } else {
                    // Є правильна відповідь - виділити зеленим БЕЗ галочки
                    const answerHTML = q.options.map((opt, i) => {
                        const isCorrect = i === q.correct_index;
                        const style = isCorrect 
                            ? 'margin-bottom: 10px; padding: 12px 12px 12px 35px; position: relative; background: #d4edda; border-left: 4px solid var(--green); border-radius: 8px; font-weight: 600;'
                            : 'margin-bottom: 10px; padding-left: 35px; position: relative; opacity: 0.7;';
                        const letterColor = isCorrect ? 'var(--green)' : 'var(--gray-600)';
                        
                        return `<div style="${style}"><span style="position: absolute; left: 0; color: ${letterColor}; font-weight: bold;">${String.fromCharCode(65 + i)}.</span>${opt}</div>`;
                    }).join('');
                    document.getElementById('answerText').innerHTML = answerHTML;
                }
            } else {
                document.getElementById('card').style.display = 'none';
                document.getElementById('quizMode').classList.remove('hidden');
                
                document.getElementById('quizTopicBadge').textContent = q.topic;
                document.getElementById('quizQuestionNumber').textContent = `Питання ${currentIndex + 1} з ${currentQuestions.length}`;
                document.getElementById('quizQuestionText').textContent = q.question;
                
                const optionsHTML = q.options.map((opt, i) => 
                    `<div class="option" data-index="${i}">${opt}</div>`
                ).join('');
                document.getElementById('quizOptions').innerHTML = optionsHTML;
                
                document.querySelectorAll('.option').forEach(opt => {
                    opt.addEventListener('click', function() {
                        document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
                        this.classList.add('selected');
                        selectedAnswer = parseInt(this.dataset.index);
                    });
                });
                
                document.getElementById('checkAnswerBtn').classList.remove('hidden');
                document.getElementById('nextQuizBtn').classList.add('hidden');
                // classList.add('hidden');
            }
            
            updateStats();
        }
        
        function showAnswer() {
            document.getElementById('cardFront').classList.remove('active');
            document.getElementById('cardBack').classList.add('active');
        }
        
        function checkAnswer() {
            if (selectedAnswer === null) {
                alert('Виберіть відповідь!');
                return;
            }
            
            const q = currentQuestions[currentIndex];
            const correctIndex = q.correct_index;
            
            const options = document.querySelectorAll('.option');
            
            // Якщо немає правильної відповіді в базі
            if (correctIndex === null) {
                alert('⚠️ Для цього питання правильна відповідь не визначена в базі даних.');
                return;
            }
            
            const isCorrect = selectedAnswer === correctIndex;
            
            if (correctIndex < options.length) {
                options[correctIndex].classList.add('correct');
            }
            
            if (isCorrect) {
                stats.correct++;
            } else {
                stats.wrong++;
                options[selectedAnswer].classList.add('wrong');
            }
            
            saveStats(); // Зберегти прогрес
            
            document.getElementById('checkAnswerBtn').classList.add('hidden');
            document.getElementById('nextQuizBtn').classList.remove('hidden');
            // classList.remove('hidden');
            
            updateStats();
        }
        
        
        
        function nextQuestion() {
            currentIndex++;
            
            if (currentIndex >= currentQuestions.length) {
                alert('🎉 Ви завершили всі питання!\n\nПравильно: ' + stats.correct + '\nНеправильно: ' + stats.wrong);
                currentIndex = 0;
            }
            
            // Зберегти індекс НАСТУПНОГО питання
            saveCurrentIndex();
            showQuestion();
        }
        
        function updateStats() {
            document.getElementById('current').textContent = currentIndex + 1;
            document.getElementById('total').textContent = currentQuestions.length;
            document.getElementById('correct').textContent = stats.correct;
            document.getElementById('wrong').textContent = stats.wrong;
            
            
            const progress = ((currentIndex + 1) / currentQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }
    </script>
</body>
